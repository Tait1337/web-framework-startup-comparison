Below is a complete replacement for `.github/workflows/benchmark.yml`. It includes:

- Framework-specific request headers.
- Independent header initialization in every shell step.
- HTTP status diagnostics when readiness fails.
- Application log output on failure.
- No invalid Spring native-image benchmark.
- More reliable Quarkus native artifact discovery.
- `--fail` on warm-up and latency requests.
- Valid YAML indentation.

```yaml
name: Web Framework Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRAALVM_VERSION: "17"
  PORT: "8080"
  RUNS: "7"
  STARTUP_TIMEOUT: "120"

jobs:
  benchmark:
    name: ${{ matrix.framework }} / ${{ matrix.runtime }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        framework:
          - Spring
          - Quarkus
          - Ktor
          - Http4k
        runtime:
          - jvm
          - native
        exclude:
          # Spring native creates a container image, not a directly executable
          # artifact. It is therefore not included in this benchmark.
          - framework: Spring
            runtime: native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Gradle wrapper executable
        shell: bash
        run: |
          set -euo pipefail

          chmod +x \
            Spring/gradlew \
            Quarkus/gradlew \
            Ktor/gradlew \
            Http4k/gradlew

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup GraalVM
        if: matrix.runtime == 'native'
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.GRAALVM_VERSION }}
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: gradle

      - name: Show environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Framework: ${{ matrix.framework }}"
          echo "Runtime:   ${{ matrix.runtime }}"
          echo
          java -version
          echo
          native-image --version 2>/dev/null || true
          echo
          nproc
          free -h

      - name: Build JVM
        if: matrix.runtime == 'jvm'
        id: build_jvm
        working-directory: ${{ matrix.framework }}
        shell: bash
        run: |
          set -euo pipefail

          START=$(date +%s%N)

          ./gradlew clean build --no-daemon

          END=$(date +%s%N)
          BUILD_MS=$(( (END - START) / 1000000 ))

          echo "Build time: ${BUILD_MS} ms"
          echo "build_ms=${BUILD_MS}" >> "$GITHUB_OUTPUT"

      - name: Build Native
        if: matrix.runtime == 'native'
        id: build_native
        working-directory: ${{ matrix.framework }}
        shell: bash
        run: |
          set -euo pipefail

          START=$(date +%s%N)

          case "${{ matrix.framework }}" in
            Quarkus)
              ./gradlew clean build \
                -Dquarkus.native.enabled=true \
                -Dquarkus.native.container-build=false \
                --no-daemon
              ;;
            Ktor|Http4k)
              ./gradlew clean shadowJar --no-daemon
              ;;
            *)
              echo "::error::Unsupported native framework: ${{ matrix.framework }}"
              exit 1
              ;;
          esac

          END=$(date +%s%N)
          BUILD_MS=$(( (END - START) / 1000000 ))

          echo "Build time: ${BUILD_MS} ms"
          echo "build_ms=${BUILD_MS}" >> "$GITHUB_OUTPUT"

      - name: Find JVM artifact
        if: matrix.runtime == 'jvm'
        id: artifact_jvm
        working-directory: ${{ matrix.framework }}
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.framework }}" in
            Spring)
              ARTIFACT=$(find build/libs \
                -type f \
                -name "*.jar" \
                ! -name "*plain.jar" \
                | head -n 1)
              ;;
            Quarkus)
              ARTIFACT="build/quarkus-app/quarkus-run.jar"
              ;;
            Ktor|Http4k)
              ARTIFACT=$(find build/libs \
                -type f \
                -name "*.jar" \
                ! -name "*plain.jar" \
                | head -n 1)
              ;;
            *)
              echo "::error::Unsupported JVM framework"
              exit 1
              ;;
          esac

          if [[ -z "${ARTIFACT:-}" || ! -f "$ARTIFACT" ]]; then
            echo "::error::Could not find JVM artifact"
            find build -type f | sort
            exit 1
          fi

          SIZE_BYTES=$(stat -c%s "$ARTIFACT")
          SIZE_MB=$(awk "BEGIN { printf \"%.2f\", ${SIZE_BYTES}/1024/1024 }")

          echo "Artifact: $ARTIFACT"
          echo "Size: ${SIZE_MB} MB"

          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"

      - name: Find Quarkus native artifact
        if: matrix.runtime == 'native' && matrix.framework == 'Quarkus'
        id: artifact_quarkus
        working-directory: Quarkus
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT=$(find build \
            -type f \
            \( -name "*-runner" -o -name "app" \) \
            ! -name "*.jar" \
            | head -n 1)

          if [[ -z "${ARTIFACT:-}" || ! -f "$ARTIFACT" ]]; then
            echo "::error::Could not find Quarkus native executable"
            find build -type f -printf '%M %p\n' | sort
            exit 1
          fi

          chmod +x "$ARTIFACT"

          SIZE_BYTES=$(stat -c%s "$ARTIFACT")
          SIZE_MB=$(awk "BEGIN { printf \"%.2f\", ${SIZE_BYTES}/1024/1024 }")

          echo "Artifact: $ARTIFACT"
          echo "Size: ${SIZE_MB} MB"

          echo "artifact=$PWD/$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"

      - name: Build Ktor native executable
        if: matrix.runtime == 'native' && matrix.framework == 'Ktor'
        id: ktor_native
        working-directory: Ktor
        shell: bash
        run: |
          set -euo pipefail

          JAR=$(find build/libs \
            -type f \
            -name "*.jar" \
            ! -name "*plain.jar" \
            | head -n 1)

          if [[ -z "${JAR:-}" || ! -f "$JAR" ]]; then
            echo "::error::Could not find Ktor fat JAR"
            find build -type f | sort
            exit 1
          fi

          native-image \
            --no-fallback \
            --enable-url-protocols=http \
            -H:+ReportExceptionStackTraces \
            -jar "$JAR" \
            app

          chmod +x app

          SIZE_BYTES=$(stat -c%s app)
          SIZE_MB=$(awk "BEGIN { printf \"%.2f\", ${SIZE_BYTES}/1024/1024 }")

          echo "Native binary: ${SIZE_MB} MB"
          echo "artifact=$PWD/app" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"

      - name: Build Http4k native executable
        if: matrix.runtime == 'native' && matrix.framework == 'Http4k'
        id: http4k_native
        working-directory: Http4k
        shell: bash
        run: |
          set -euo pipefail

          JAR=$(find build/libs \
            -type f \
            -name "*.jar" \
            ! -name "*plain.jar" \
            | head -n 1)

          if [[ -z "${JAR:-}" || ! -f "$JAR" ]]; then
            echo "::error::Could not find Http4k fat JAR"
            find build -type f | sort
            exit 1
          fi

          native-image \
            --no-fallback \
            --enable-url-protocols=http \
            -H:+ReportExceptionStackTraces \
            -jar "$JAR" \
            app

          chmod +x app

          SIZE_BYTES=$(stat -c%s app)
          SIZE_MB=$(awk "BEGIN { printf \"%.2f\", ${SIZE_BYTES}/1024/1024 }")

          echo "Native binary: ${SIZE_MB} MB"
          echo "artifact=$PWD/app" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"

      - name: Benchmark JVM
        if: matrix.runtime == 'jvm'
        id: benchmark_jvm
        working-directory: ${{ matrix.framework }}
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT="${{ steps.artifact_jvm.outputs.artifact }}"

          CURL_HEADERS=()

          case "${{ matrix.framework }}" in
            Spring)
              CURL_HEADERS=(-H "Accept: text/html")
              ;;
            Quarkus)
              CURL_HEADERS=(-H "Content-Type: text/html")
              ;;
          esac

          STARTUP_VALUES=""
          MEMORY_VALUES=""

          for RUN in $(seq 1 "$RUNS"); do
            echo
            echo "JVM run ${RUN} / ${RUNS}"

            rm -f /tmp/framework.log

            START=$(date +%s%N)

            java -jar "$ARTIFACT" \
              > /tmp/framework.log 2>&1 &

            PID=$!
            READY=0
            LAST_STATUS="none"

            for SECOND in $(seq 1 "$STARTUP_TIMEOUT"); do
              LAST_STATUS=$(curl \
                "${CURL_HEADERS[@]}" \
                --silent \
                --output /dev/null \
                --write-out '%{http_code}' \
                --max-time 1 \
                "http://127.0.0.1:${PORT}/greet/John" || true)

              if [[ "$LAST_STATUS" == "200" ]]; then
                END=$(date +%s%N)
                STARTUP_MS=$(( (END - START) / 1000000 ))
                READY=1
                break
              fi

              if ! kill -0 "$PID" 2>/dev/null; then
                break
              fi

              sleep 1
            done

            if [[ "$READY" != "1" ]]; then
              echo "::error::JVM application did not become ready"
              echo "::error::Last HTTP status: ${LAST_STATUS}"
              cat /tmp/framework.log || true
              kill "$PID" 2>/dev/null || true
              exit 1
            fi

            sleep 2

            RSS_KB=$(ps -o rss= -p "$PID" | tr -d ' ')

            if [[ -z "$RSS_KB" ]]; then
              echo "::error::Could not read JVM RSS"
              kill "$PID" 2>/dev/null || true
              exit 1
            fi

            RSS_MB=$(awk "BEGIN { printf \"%.2f\", ${RSS_KB}/1024 }")

            echo "Startup: ${STARTUP_MS} ms"
            echo "Memory:  ${RSS_MB} MB"

            STARTUP_VALUES="${STARTUP_VALUES}${STARTUP_MS}"$'\n'
            MEMORY_VALUES="${MEMORY_VALUES}${RSS_MB}"$'\n'

            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            fuser -k "${PORT}/tcp" 2>/dev/null || true
            sleep 1
          done

          MEDIAN_STARTUP=$(echo "$STARTUP_VALUES" | sort -n | awk '
            NF { a[++n]=$1 }
            END {
              if (n % 2)
                print a[(n+1)/2]
              else
                printf "%.1f", (a[n/2]+a[n/2+1])/2
            }
          ')

          P95_STARTUP=$(echo "$STARTUP_VALUES" | sort -n | awk '
            NF { a[++n]=$1 }
            END {
              i=int(n*0.95+0.999)
              if (i<1) i=1
              print a[i]
            }
          ')

          MEDIAN_MEMORY=$(echo "$MEMORY_VALUES" | sort -n | awk '
            NF { a[++n]=$1 }
            END {
              if (n % 2)
                printf "%.2f", a[(n+1)/2]
              else
                printf "%.2f", (a[n/2]+a[n/2+1])/2
            }
          ')

          echo "startup_median_ms=${MEDIAN_STARTUP}" >> "$GITHUB_OUTPUT"
          echo "startup_p95_ms=${P95_STARTUP}" >> "$GITHUB_OUTPUT"
          echo "memory_median_mb=${MEDIAN_MEMORY}" >> "$GITHUB_OUTPUT"

      - name: Benchmark Native
        if: matrix.runtime == 'native'
        id: benchmark_native
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.framework }}" in
            Quarkus)
              ARTIFACT="${{ steps.artifact_quarkus.outputs.artifact }}"
              CURL_HEADERS=(-H "Content-Type: text/html")
              ;;
            Ktor)
              ARTIFACT="${{ steps.ktor_native.outputs.artifact }}"
              CURL_HEADERS=()
              ;;
            Http4k)
              ARTIFACT="${{ steps.http4k_native.outputs.artifact }}"
              CURL_HEADERS=()
              ;;
            *)
              echo "::error::Unsupported native framework"
              exit 1
              ;;
          esac

          chmod +x "$ARTIFACT"

          STARTUP_VALUES=""
          MEMORY_VALUES=""

          for RUN in $(seq 1 "$RUNS"); do
            echo
            echo "Native run ${RUN} / ${RUNS}"

            rm -f /tmp/framework.log

            START=$(date +%s%N)

            "$ARTIFACT" \
              > /tmp/framework.log 2>&1 &

            PID=$!
            READY=0
            LAST_STATUS="none"

            for SECOND in $(seq 1 "$STARTUP_TIMEOUT"); do
              LAST_STATUS=$(curl \
                "${CURL_HEADERS[@]}" \
                --silent \
                --output /dev/null \
                --write-out '%{http_code}' \
                --max-time 1 \
                "http://127.0.0.1:${PORT}/greet/John" || true)

              if [[ "$LAST_STATUS" == "200" ]]; then
                END=$(date +%s%N)
                STARTUP_MS=$(( (END - START) / 1000000 ))
                READY=1
                break
              fi

              if ! kill -0 "$PID" 2>/dev/null; then
                break
              fi

              sleep 1
            done

            if [[ "$READY" != "1" ]]; then
              echo "::error::Native application did not become ready"
              echo "::error::Last HTTP status: ${LAST_STATUS}"
              cat /tmp/framework.log || true
              kill "$PID" 2>/dev/null || true
              exit 1
            fi

            sleep 2

            RSS_KB=$(ps -o rss= -p "$PID" | tr -d ' ')

            if [[ -z "$RSS_KB" ]]; then
              echo "::error::Could not read native RSS"
              kill "$PID" 2>/dev/null || true
              exit 1
            fi

            RSS_MB=$(awk "BEGIN { printf \"%.2f\", ${RSS_KB}/1024 }")

            echo "Startup: ${STARTUP_MS} ms"
            echo "Memory:  ${RSS_MB} MB"

            STARTUP_VALUES="${STARTUP_VALUES}${STARTUP_MS}"$'\n'
            MEMORY_VALUES="${MEMORY_VALUES}${RSS_MB}"$'\n'

            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            fuser -k "${PORT}/tcp" 2>/dev/null || true
            sleep 1
          done

          MEDIAN_STARTUP=$(echo "$STARTUP_VALUES" | sort -n | awk '
            NF { a[++n]=$1 }
            END {
              if (n % 2)
                print a[(n+1)/2]
              else
                printf "%.1f", (a[n/2]+a[n/2+1])/2
            }
          ')

          P95_STARTUP=$(echo "$STARTUP_VALUES" | sort -n | awk '
            NF { a[++n]=$1 }
            END {
              i=int(n*0.95+0.999)
              if (i<1) i=1
              print a[i]
            }
          ')

          MEDIAN_MEMORY=$(echo "$MEMORY_VALUES" | sort -n | awk '
            NF { a[++n]=$1 }
            END {
              if (n % 2)
                printf "%.2f", a[(n+1)/2]
              else
                printf "%.2f", (a[n/2]+a[n/2+1])/2
            }
          ')

          echo "startup_median_ms=${MEDIAN_STARTUP}" >> "$GITHUB_OUTPUT"
          echo "startup_p95_ms=${P95_STARTUP}" >> "$GITHUB_OUTPUT"
          echo "memory_median_mb=${MEDIAN_MEMORY}" >> "$GITHUB_OUTPUT"

      - name: HTTP latency benchmark
        if: matrix.runtime == 'jvm' || matrix.runtime == 'native'
        id: http
        shell: bash
        run: |
          set -euo pipefail

          CURL_HEADERS=()

          case "${{ matrix.framework }}" in
            Spring)
              CURL_HEADERS=(-H "Accept: text/html")
              ;;
            Quarkus)
              CURL_HEADERS=(-H "Content-Type: text/html")
              ;;
          esac

          if [[ "${{ matrix.runtime }}" == "jvm" ]]; then
            ARTIFACT="${{ steps.artifact_jvm.outputs.artifact }}"

            (
              cd "${{ matrix.framework }}"
              java -jar "$ARTIFACT"
            ) > /tmp/framework.log 2>&1 &
          else
            case "${{ matrix.framework }}" in
              Quarkus)
                ARTIFACT="${{ steps.artifact_quarkus.outputs.artifact }}"
                ;;
              Ktor)
                ARTIFACT="${{ steps.ktor_native.outputs.artifact }}"
                ;;
              Http4k)
                ARTIFACT="${{ steps.http4k_native.outputs.artifact }}"
                ;;
            esac

            chmod +x "$ARTIFACT"
            "$ARTIFACT" > /tmp/framework.log 2>&1 &
          fi

          PID=$!
          READY=0
          LAST_STATUS="none"

          for SECOND in $(seq 1 "$STARTUP_TIMEOUT"); do
            LAST_STATUS=$(curl \
              "${CURL_HEADERS[@]}" \
              --silent \
              --output /dev/null \
              --write-out '%{http_code}' \
              --max-time 1 \
              "http://127.0.0.1:${PORT}/greet/John" || true)

            if [[ "$LAST_STATUS" == "200" ]]; then
              READY=1
              break
            fi

            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi

            sleep 1
          done

          if [[ "$READY" != "1" ]]; then
            echo "::error::Application did not become ready"
            echo "::error::Last HTTP status: ${LAST_STATUS}"
            cat /tmp/framework.log || true
            kill "$PID" 2>/dev/null || true
            exit 1
          fi

          for i in {1..20}; do
            curl \
              "${CURL_HEADERS[@]}" \
              --silent \
              --fail \
              --output /dev/null \
              "http://127.0.0.1:${PORT}/greet/John"
          done

          VALUES=""

          for i in $(seq 1 100); do
            TIME=$(curl \
              "${CURL_HEADERS[@]}" \
              --silent \
              --fail \
              --output /dev/null \
              --write-out '%{time_total}' \
              "http://127.0.0.1:${PORT}/greet/John")

            VALUES="${VALUES}${TIME}"$'\n'
          done

          AVG=$(echo "$VALUES" | awk '
            NF {
              sum += $1
              count++
            }
            END {
              printf "%.4f", sum/count
            }
          ')

          MEDIAN=$(echo "$VALUES" | sort -n | awk '
            NF { a[++n]=$1 }
            END {
              if (n % 2)
                printf "%.4f", a[(n+1)/2]
              else
                printf "%.4f", (a[n/2]+a[n/2+1])/2
            }
          ')

          P95=$(echo "$VALUES" | sort -n | awk '
            NF { a[++n]=$1 }
            END {
              i=int(n*0.95+0.999)
              if (i<1) i=1
              printf "%.4f", a[i]
            }
          ')

          echo "HTTP average: ${AVG}s"
          echo "HTTP median:  ${MEDIAN}s"
          echo "HTTP P95:     ${P95}s"

          echo "avg_seconds=${AVG}" >> "$GITHUB_OUTPUT"
          echo "median_seconds=${MEDIAN}" >> "$GITHUB_OUTPUT"
          echo "p95_seconds=${P95}" >> "$GITHUB_OUTPUT"

          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          fuser -k "${PORT}/tcp" 2>/dev/null || true

      - name: Create result JSON
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p results

          FRAMEWORK="${{ matrix.framework }}"
          RUNTIME="${{ matrix.runtime }}"

          if [[ "$RUNTIME" == "jvm" ]]; then
            BUILD="${{ steps.build_jvm.outputs.build_ms || 0 }}"
            ARTIFACT="${{ steps.artifact_jvm.outputs.size_mb || 0 }}"
            STARTUP="${{ steps.benchmark_jvm.outputs.startup_median_ms || 0 }}"
            STARTUP_P95="${{ steps.benchmark_jvm.outputs.startup_p95_ms || 0 }}"
            MEMORY="${{ steps.benchmark_jvm.outputs.memory_median_mb || 0 }}"
          else
            BUILD="${{ steps.build_native.outputs.build_ms || 0 }}"
            STARTUP="${{ steps.benchmark_native.outputs.startup_median_ms || 0 }}"
            STARTUP_P95="${{ steps.benchmark_native.outputs.startup_p95_ms || 0 }}"
            MEMORY="${{ steps.benchmark_native.outputs.memory_median_mb || 0 }}"

            case "$FRAMEWORK" in
              Quarkus)
                ARTIFACT="${{ steps.artifact_quarkus.outputs.size_mb || 0 }}"
                ;;
              Ktor)
                ARTIFACT="${{ steps.ktor_native.outputs.size_mb || 0 }}"
                ;;
              Http4k)
                ARTIFACT="${{ steps.http4k_native.outputs.size_mb || 0 }}"
                ;;
              *)
                ARTIFACT="0"
                ;;
            esac
          fi

          HTTP_AVG="${{ steps.http.outputs.avg_seconds || 0 }}"
          HTTP_MEDIAN="${{ steps.http.outputs.median_seconds || 0 }}"
          HTTP_P95="${{ steps.http.outputs.p95_seconds || 0 }}"

          cat > "results/${FRAMEWORK}-${RUNTIME}.json" <<EOF
          {
            "framework": "$FRAMEWORK",
            "runtime": "$RUNTIME",
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "runner": "${RUNNER_OS}",
            "java_version": "${JAVA_VERSION}",
            "measurements": ${RUNS},
            "build_time_ms": ${BUILD},
            "artifact_size_mb": ${ARTIFACT},
            "startup_median_ms": ${STARTUP},
            "startup_p95_ms": ${STARTUP_P95},
            "memory_median_mb": ${MEMORY},
            "http_average_seconds": ${HTTP_AVG},
            "http_median_seconds": ${HTTP_MEDIAN},
            "http_p95_seconds": ${HTTP_P95}
          }
          EOF

          cat "results/${FRAMEWORK}-${RUNTIME}.json"

      - name: Upload individual result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.framework }}-${{ matrix.runtime }}
          path: results/
          retention-days: 30
          if-no-files-found: error

  report:
    name: Generate benchmark report
    runs-on: ubuntu-latest
    needs: benchmark
    if: always()

    steps:
      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: downloaded
          merge-multiple: true

      - name: Generate combined report
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports

          jq -s '.' downloaded/*.json > reports/results.json

          cat > reports/results.md <<EOF
          # Web Framework Benchmark

          **Run:** ${GITHUB_RUN_NUMBER}

          **Commit:** \`${GITHUB_SHA}\`

          **Measurements per runtime:** ${RUNS}

          ## Results

          | Framework | Runtime | Build | Artifact | Startup median | Startup P95 | Memory median | HTTP avg | HTTP P95 |
          |---|---|---:|---:|---:|---:|---:|---:|---:|
          EOF

          jq -r '
            sort_by(.framework, .runtime)[] |
            "| \(.framework) | \(.runtime) | \(.build_time_ms) ms | \(.artifact_size_mb) MB | \(.startup_median_ms) ms | \(.startup_p95_ms) ms | \(.memory_median_mb) MB | \(.http_average_seconds) s | \(.http_p95_seconds) s |"
          ' reports/results.json >> reports/results.md

          cat reports/results.md

      - name: Add report to GitHub Summary
        shell: bash
        run: |
          cat reports/results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            reports/results.md
            reports/results.json
          retention-days: 90
          if-no-files-found: error
```
