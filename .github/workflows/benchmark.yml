name: Web Framework Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRAALVM_VERSION: "17"
  PORT: "8080"
  RUNS: "7"
  STARTUP_TIMEOUT: "120"
  SPRING_NATIVE_IMAGE: "benchmark-spring-native:${{ github.run_id }}-${{ github.run_attempt }}"

jobs:
  benchmark:
    name: ${{ matrix.framework }} / ${{ matrix.runtime }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        framework:
          - Spring
          - Quarkus
          - Ktor
          - Http4k
        runtime:
          - jvm
          - native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Gradle wrapper executable
        shell: bash
        run: |
          set -euo pipefail

          chmod +x \
            Spring/gradlew \
            Quarkus/gradlew \
            Ktor/gradlew \
            Http4k/gradlew

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # Spring uses GraalVM from the Cloud Native Buildpacks builder.
      # Quarkus uses its own compatible builder container.
      - name: Setup GraalVM
        if: >-
          matrix.runtime == 'native' &&
          matrix.framework != 'Quarkus' &&
          matrix.framework != 'Spring'
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.GRAALVM_VERSION }}
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: gradle

      - name: Show environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Framework: ${{ matrix.framework }}"
          echo "Runtime:   ${{ matrix.runtime }}"
          echo

          java -version

          echo
          native-image --version 2>/dev/null || true

          echo
          docker --version 2>/dev/null || true

          echo
          nproc

          free -h

      - name: Prepare Quarkus native builder
        if: matrix.runtime == 'native' && matrix.framework == 'Quarkus'
        shell: bash
        run: |
          set -euo pipefail

          docker pull quay.io/quarkus/ubi-quarkus-native-image:22.0-java17

      # -----------------------------------------------------------------------
      # JVM BUILD
      # -----------------------------------------------------------------------

      - name: Build JVM
        if: matrix.runtime == 'jvm'
        id: build_jvm
        working-directory: ${{ matrix.framework }}
        shell: bash
        run: |
          set -euo pipefail

          START=$(date +%s%N)

          case "${{ matrix.framework }}" in
            Ktor|Http4k)
              ./gradlew clean build shadowJar --no-daemon
              ;;
            *)
              ./gradlew clean build --no-daemon
              ;;
          esac

          END=$(date +%s%N)
          BUILD_MS=$(( (END - START) / 1000000 ))

          echo "Build time: ${BUILD_MS} ms"
          echo "build_ms=${BUILD_MS}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # NATIVE BUILD
      # -----------------------------------------------------------------------
      - name: Verify BellSoft download endpoint
        if: matrix.runtime == 'native' && matrix.framework == 'Spring'
        shell: bash
        run: |
          set -euo pipefail

          URL="https://download.bell-sw.com/vm/23.0.0/bellsoft-liberica-vm-core-openjdk17.0.7+7-23.0.0+1-linux-amd64.tar.gz"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --head \
            "$URL"
      - name: Prepare Spring native builder
        if: matrix.runtime == 'native' && matrix.framework == 'Spring'
        shell: bash
        run: |
          set -euo pipefail

          docker pull docker.io/paketobuildpacks/builder-jammy-tiny:latest
      - name: Build Native
        if: matrix.runtime == 'native'
        id: build_native
        working-directory: ${{ matrix.framework }}
        shell: bash
        run: |
          set -euo pipefail

          START=$(date +%s%N)

          case "${{ matrix.framework }}" in
            Spring)
              echo "========================================"
              echo "Building Spring native container image"
              echo "Image: $SPRING_NATIVE_IMAGE"
              echo "========================================"

              ./gradlew clean bootBuildImage \
                --imageName="$SPRING_NATIVE_IMAGE" \
                --no-daemon

              if ! docker image inspect "$SPRING_NATIVE_IMAGE" \
                >/dev/null 2>&1; then
                echo "::error::Spring native container image was not created"
                echo "::error::Expected image: $SPRING_NATIVE_IMAGE"
                docker image ls
                exit 1
              fi

              SIZE_BYTES=$(docker image inspect \
                "$SPRING_NATIVE_IMAGE" \
                --format '{{.Size}}')

              echo
              echo "Spring native container image created:"
              echo "  Image: $SPRING_NATIVE_IMAGE"
              echo "  Size:  ${SIZE_BYTES} bytes"

              echo
              echo "Image configuration:"
              docker image inspect "$SPRING_NATIVE_IMAGE" \
                --format 'Entrypoint={{json .Config.Entrypoint}} Cmd={{json .Config.Cmd}}'
              ;;

            Quarkus)
              ./gradlew clean build \
                -Dquarkus.package.type=native \
                -Dquarkus.native.container-build=true \
                -Dquarkus.native.additional-build-args=-J-XX:-UseContainerSupport \
                --no-daemon
              ;;

            Ktor)
              echo "========================================"
              echo "Building Ktor executable fat JAR"
              echo "========================================"

              ./gradlew clean shadowJar --no-daemon

              JAR=$(find build/libs \
                -maxdepth 1 \
                -type f \
                -name "*-all.jar" \
                -print \
                -quit)

              if [[ -z "${JAR:-}" || ! -f "$JAR" ]]; then
                echo "::error::Could not find Ktor executable fat JAR"
                echo "::error::Expected a file matching build/libs/*-all.jar"
                find build/libs \
                  -maxdepth 1 \
                  -type f \
                  -printf '%p\n' |
                  sort || true
                exit 1
              fi

              echo "Ktor fat JAR: $JAR"

              if ! unzip -p "$JAR" META-INF/MANIFEST.MF |
                grep -qi '^Main-Class:'; then
                echo "::error::Ktor fat JAR has no Main-Class manifest entry"
                unzip -p "$JAR" META-INF/MANIFEST.MF || true
                exit 1
              fi

              if [[ ! -f "graal-reflection-configuration.json" ]]; then
                echo "::error::Missing Ktor GraalVM reflection configuration"
                echo "::error::Expected: Ktor/graal-reflection-configuration.json"
                exit 1
              fi

              echo
              echo "========================================"
              echo "Building Ktor GraalVM native executable"
              echo "========================================"

              native-image --version
              rm -f app

              native-image \
                --no-fallback \
                --static \
                --enable-url-protocols=http \
                -H:+ReportExceptionStackTraces \
                -H:IncludeResources="(.*.properties)|(static/.*)|(META-INF/.*)" \
                -H:ReflectionConfigurationFiles=graal-reflection-configuration.json \
                --allow-incomplete-classpath \
                --initialize-at-build-time=io.ktor,kotlinx,kotlin \
                -jar "$JAR" \
                app

              if [[ ! -s "app" ]]; then
                echo "::error::Ktor native executable was not created"
                find . -maxdepth 2 -type f -printf '%p\n' | sort
                exit 1
              fi

              chmod +x app
              ;;

            Http4k)
              # The native executable itself is built by the later Http4k step,
              # after generating its native-image configuration with the agent.
              ./gradlew clean shadowJar --no-daemon
              ;;

            *)
              echo "::error::Unsupported native framework: ${{ matrix.framework }}"
              exit 1
              ;;
          esac

          END=$(date +%s%N)
          BUILD_MS=$(( (END - START) / 1000000 ))

          echo
          echo "Native build time: ${BUILD_MS} ms"
          echo "build_ms=${BUILD_MS}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # FIND JVM ARTIFACT
      # -----------------------------------------------------------------------

      - name: Find JVM artifact
        if: matrix.runtime == 'jvm'
        id: artifact_jvm
        working-directory: ${{ matrix.framework }}
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.framework }}" in
            Spring)
              # Benchmark the regular Spring Boot JVM application.
              # The *-aot.jar is an intermediate native-build artifact and
              # cannot be started using java -jar.
              ARTIFACT=$(find build/libs \
                -maxdepth 1 \
                -type f \
                -name "*.jar" \
                ! -name "*-aot.jar" \
                ! -name "*-plain.jar" \
                ! -name "*-sources.jar" \
                ! -name "*-javadoc.jar" \
                -print \
                -quit)

              if [[ -z "${ARTIFACT:-}" || ! -f "$ARTIFACT" ]]; then
                echo "::error::Could not find normal Spring Boot JVM artifact"
                find build/libs \
                  -maxdepth 1 \
                  -type f \
                  -name "*.jar" \
                  -printf '%s %p\n' |
                  sort || true
                exit 1
              fi

              MANIFEST=$(unzip -p "$ARTIFACT" META-INF/MANIFEST.MF)

              if ! grep -qE \
                '^Main-Class: org\.springframework\.boot\.loader\.' \
                <<< "$MANIFEST"; then
                echo "::error::Spring JVM artifact is not an executable Boot JAR"
                echo "::error::Artifact: $ARTIFACT"
                echo
                echo "$MANIFEST"
                exit 1
              fi

              if ! grep -q '^Start-Class:' <<< "$MANIFEST"; then
                echo "::error::Spring JVM artifact has no Start-Class"
                echo "::error::Artifact: $ARTIFACT"
                echo
                echo "$MANIFEST"
                exit 1
              fi

              SIZE_BYTES=$(stat -c%s "$ARTIFACT")
              SIZE_DESCRIPTION="$ARTIFACT (regular executable Spring Boot JAR)"
              ;;

            Quarkus)
              APP_DIR="build/quarkus-app"
              ARTIFACT="${APP_DIR}/quarkus-run.jar"

              if [[ ! -f "$ARTIFACT" ]]; then
                echo "::error::Could not find Quarkus JVM launcher: $ARTIFACT"
                find build -type f | sort
                exit 1
              fi

              SIZE_BYTES=$(find "$APP_DIR" -type f -printf '%s\n' |
                awk '{ total += $1 } END { printf "%.0f", total }')

              SIZE_DESCRIPTION="$APP_DIR (complete Quarkus distribution)"
              ;;

            Ktor|Http4k)
              ARTIFACT=$(find build/libs \
                -maxdepth 1 \
                -type f \
                -name "*-all.jar" \
                -print \
                -quit)

              if [[ -z "${ARTIFACT:-}" || ! -f "$ARTIFACT" ]]; then
                echo "::error::Could not find executable ${{ matrix.framework }} fat JAR"
                echo "::error::Expected a file matching build/libs/*-all.jar"
                find build/libs \
                  -maxdepth 1 \
                  -type f \
                  -printf '%p\n' |
                  sort || true
                exit 1
              fi

              if ! unzip -p "$ARTIFACT" META-INF/MANIFEST.MF |
                grep -qi '^Main-Class:'; then
                echo "::error::The fat JAR has no Main-Class manifest entry"
                unzip -p "$ARTIFACT" META-INF/MANIFEST.MF || true
                exit 1
              fi

              SIZE_BYTES=$(stat -c%s "$ARTIFACT")
              SIZE_DESCRIPTION="$ARTIFACT (executable fat JAR)"
              ;;

            *)
              echo "::error::Unsupported JVM framework: ${{ matrix.framework }}"
              exit 1
              ;;
          esac

          if [[ -z "${SIZE_BYTES:-}" || "$SIZE_BYTES" -le 0 ]]; then
            echo "::error::Could not determine JVM artifact size"
            exit 1
          fi

          SIZE_MB=$(awk -v bytes="$SIZE_BYTES" \
            'BEGIN { printf "%.2f", bytes / 1024 / 1024 }')

          echo "Launcher: $ARTIFACT"
          echo "Measured artifact: $SIZE_DESCRIPTION"
          echo "Size: ${SIZE_BYTES} bytes (${SIZE_MB} MB)"

          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # FIND SPRING NATIVE IMAGE
      # -----------------------------------------------------------------------

      - name: Find Spring native image
        if: matrix.runtime == 'native' && matrix.framework == 'Spring'
        id: artifact_spring
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$SPRING_NATIVE_IMAGE"

          if ! docker image inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::error::Could not find Spring native image: $IMAGE"
            docker image ls
            exit 1
          fi

          SIZE_BYTES=$(docker image inspect "$IMAGE" --format '{{.Size}}')

          if [[ -z "${SIZE_BYTES:-}" || "$SIZE_BYTES" -le 0 ]]; then
            echo "::error::Could not determine Spring native image size"
            exit 1
          fi

          SIZE_MB=$(awk -v bytes="$SIZE_BYTES" \
            'BEGIN { printf "%.2f", bytes / 1024 / 1024 }')

          echo "Image: $IMAGE"
          echo "Size: ${SIZE_BYTES} bytes (${SIZE_MB} MB)"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # FIND QUARKUS NATIVE ARTIFACT
      # -----------------------------------------------------------------------

      - name: Find Quarkus native artifact
        if: matrix.runtime == 'native' && matrix.framework == 'Quarkus'
        id: artifact_quarkus
        working-directory: Quarkus
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT=$(find build \
            -type f \
            \( -name "*-runner" -o -name "app" \) \
            ! -name "*.jar" \
            -print \
            -quit)

          if [[ -z "${ARTIFACT:-}" || ! -f "$ARTIFACT" ]]; then
            echo "::error::Could not find Quarkus native executable"
            find build -type f -printf '%M %p\n' | sort
            exit 1
          fi

          chmod +x "$ARTIFACT"

          SIZE_BYTES=$(stat -c%s "$ARTIFACT")
          SIZE_MB=$(awk -v bytes="$SIZE_BYTES" \
            'BEGIN { printf "%.2f", bytes / 1024 / 1024 }')

          echo "Artifact: $PWD/$ARTIFACT"
          echo "Size: ${SIZE_BYTES} bytes (${SIZE_MB} MB)"

          echo "artifact=$PWD/$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # FIND KTOR NATIVE ARTIFACT
      # -----------------------------------------------------------------------

      - name: Find Ktor native artifact
        if: matrix.runtime == 'native' && matrix.framework == 'Ktor'
        id: artifact_ktor
        working-directory: Ktor
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT="app"

          if [[ ! -s "$ARTIFACT" ]]; then
            echo "::error::Could not find Ktor native executable"
            echo "::error::Expected: Ktor/app"
            find . -maxdepth 2 -type f -printf '%p\n' | sort
            exit 1
          fi

          chmod +x "$ARTIFACT"

          SIZE_BYTES=$(stat -c%s "$ARTIFACT")
          SIZE_MB=$(awk -v bytes="$SIZE_BYTES" \
            'BEGIN { printf "%.2f", bytes / 1024 / 1024 }')

          echo "Artifact: $PWD/$ARTIFACT"
          echo "Size: ${SIZE_BYTES} bytes (${SIZE_MB} MB)"

          echo "artifact=$PWD/$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # BUILD HTTP4K NATIVE EXECUTABLE
      # -----------------------------------------------------------------------

      - name: Build Http4k native executable
        if: matrix.runtime == 'native' && matrix.framework == 'Http4k'
        id: http4k_native
        working-directory: Http4k
        shell: bash
        run: |
          set -euo pipefail

          JAR=$(find build/libs \
            -maxdepth 1 \
            -type f \
            -name "*-all.jar" \
            -print \
            -quit)

          if [[ -z "${JAR:-}" || ! -f "$JAR" ]]; then
            echo "::error::Could not find Http4k executable fat JAR"
            echo "::error::Expected a file matching build/libs/*-all.jar"

            if [[ -d build/libs ]]; then
              find build/libs \
                -maxdepth 1 \
                -type f \
                -printf '%M %s %p\n' |
                sort || true
            else
              echo "::error::Directory does not exist: $PWD/build/libs"
            fi

            exit 1
          fi

          echo "Http4k fat JAR: $PWD/$JAR"

          if ! unzip -p "$JAR" META-INF/MANIFEST.MF |
            grep -qi '^Main-Class:'; then
            echo "::error::Http4k fat JAR has no Main-Class manifest entry"
            echo "::error::Artifact: $PWD/$JAR"

            echo
            echo "Manifest:"
            unzip -p "$JAR" META-INF/MANIFEST.MF || true

            exit 1
          fi

          CONFIG_DIR="$PWD/build/native-image-config"
          AGENT_LOG="$PWD/build/native-image-agent.log"

          rm -rf "$CONFIG_DIR"
          mkdir -p "$CONFIG_DIR"
          rm -f "$AGENT_LOG"

          echo
          echo "Generating native-image configuration for Http4k and Jackson..."

          java \
            -agentlib:native-image-agent=config-output-dir="$CONFIG_DIR" \
            -jar "$JAR" \
            > "$AGENT_LOG" 2>&1 &

          AGENT_PID=$!

          cleanup_agent() {
            if kill -0 "$AGENT_PID" 2>/dev/null; then
              kill -TERM "$AGENT_PID" 2>/dev/null || true

              for i in $(seq 1 15); do
                if ! kill -0 "$AGENT_PID" 2>/dev/null; then
                  break
                fi

                sleep 1
              done

              if kill -0 "$AGENT_PID" 2>/dev/null; then
                kill -KILL "$AGENT_PID" 2>/dev/null || true
              fi
            fi

            wait "$AGENT_PID" 2>/dev/null || true
            fuser -k "${PORT}/tcp" 2>/dev/null || true
          }

          trap cleanup_agent EXIT

          READY=0
          LAST_STATUS="none"

          START=$(date +%s%N)
          DEADLINE=$(( START + STARTUP_TIMEOUT * 1000000000 ))

          while true; do
            LAST_STATUS=$(curl \
              --silent \
              --output /dev/null \
              --write-out '%{http_code}' \
              --connect-timeout 0.05 \
              --max-time 0.2 \
              "http://127.0.0.1:${PORT}/greet/John" || true)

            if [[ "$LAST_STATUS" == "200" ]]; then
              READY=1
              break
            fi

            # Important: this process was stored in AGENT_PID.
            if ! kill -0 "$AGENT_PID" 2>/dev/null; then
              break
            fi

            NOW=$(date +%s%N)

            if (( NOW >= DEADLINE )); then
              break
            fi

            sleep 0.01
          done

          if [[ "$READY" != "1" ]]; then
            echo "::error::Http4k did not become ready while generating native-image configuration"
            echo "::error::Last HTTP status: ${LAST_STATUS}"

            echo
            echo "Native-image agent application log:"
            cat "$AGENT_LOG" || true

            exit 1
          fi

          # Exercise the endpoint so the native-image agent observes Jackson,
          # Kotlin reflection and the response DTO.
          for i in $(seq 1 20); do
            RESPONSE=$(curl \
              --silent \
              --show-error \
              --fail \
              "http://127.0.0.1:${PORT}/greet/John")

            echo "Agent request ${i}: ${RESPONSE}"
          done

          # Stop the instrumented JVM gracefully. This allows the agent to
          # finish writing its configuration files.
          cleanup_agent
          trap - EXIT

          echo
          echo "Generated native-image configuration files:"

          find "$CONFIG_DIR" \
            -maxdepth 1 \
            -type f \
            -printf '%M %s %p\n' |
            sort || true

          if [[ ! -f "$CONFIG_DIR/reflect-config.json" ]]; then
            echo "::error::The native-image agent did not generate reflect-config.json"
            echo "::error::Expected: $CONFIG_DIR/reflect-config.json"

            echo
            echo "Native-image agent application log:"
            cat "$AGENT_LOG" || true

            exit 1
          fi

          echo
          echo "Building Http4k native executable..."

          OUTPUT="$PWD/app"
          rm -f "$OUTPUT"

          if ! native-image \
            --no-fallback \
            --enable-url-protocols=http \
            -H:+ReportExceptionStackTraces \
            -H:ConfigurationFileDirectories="$CONFIG_DIR" \
            -jar "$JAR" \
            app; then
            echo "::error::Http4k native-image compilation failed"

            echo
            echo "Files present after the failed native-image invocation:"
            find "$PWD" \
              -maxdepth 2 \
              -type f \
              -printf '%M %s %p\n' |
              sort || true

            exit 1
          fi

          if [[ ! -f "$OUTPUT" ]]; then
            echo "::error::Http4k native-image completed without creating the expected executable"
            echo "::error::Expected output: $OUTPUT"

            find "$PWD" \
              -maxdepth 2 \
              -type f \
              -printf '%M %s %p\n' |
              sort || true

            exit 1
          fi

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::Http4k native executable exists but is empty"
            ls -l "$OUTPUT" || true
            exit 1
          fi

          chmod +x "$OUTPUT"

          if [[ ! -x "$OUTPUT" ]]; then
            echo "::error::Http4k native artifact is not executable"
            ls -l "$OUTPUT" || true
            exit 1
          fi

          echo
          echo "Native executable details:"
          ls -lh "$OUTPUT"
          file "$OUTPUT" || true

          SIZE_BYTES=$(stat -c%s "$OUTPUT")
          SIZE_MB=$(awk -v bytes="$SIZE_BYTES" \
            'BEGIN { printf "%.2f", bytes / 1024 / 1024 }')

          echo
          echo "Http4k native executable:"
          echo "  Path: $OUTPUT"
          echo "  Size: ${SIZE_BYTES} bytes"
          echo "  Size: ${SIZE_MB} MB"

          echo "artifact=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # BENCHMARK JVM
      # -----------------------------------------------------------------------

      - name: Benchmark JVM
        if: matrix.runtime == 'jvm'
        id: benchmark_jvm
        working-directory: ${{ matrix.framework }}
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT="${{ steps.artifact_jvm.outputs.artifact }}"
          CURL_HEADERS=()

          case "${{ matrix.framework }}" in
            Spring)
              CURL_HEADERS=(-H "Accept: text/html")
              ;;
            Quarkus)
              CURL_HEADERS=(-H "Content-Type: text/html")
              ;;
          esac

          STARTUP_VALUES=""
          MEMORY_VALUES=""

          for RUN in $(seq 1 "$RUNS"); do
            echo
            echo "JVM run ${RUN} / ${RUNS}"

            rm -f /tmp/framework.log

            START=$(date +%s%N)

            java -jar "$ARTIFACT" > /tmp/framework.log 2>&1 &

            PID=$!
            READY=0
            LAST_STATUS="none"
            START_SECONDS=$(date +%s)

            while true; do
              LAST_STATUS=$(curl \
                "${CURL_HEADERS[@]}" \
                --silent \
                --output /dev/null \
                --write-out '%{http_code}' \
                --connect-timeout 0.1 \
                --max-time 1 \
                "http://127.0.0.1:${PORT}/greet/John" || true)

              if [[ "$LAST_STATUS" == "200" ]]; then
                END=$(date +%s%N)
                STARTUP_MS=$(( (END - START) / 1000000 ))
                READY=1
                break
              fi

              if ! kill -0 "$PID" 2>/dev/null; then
                break
              fi

              NOW_SECONDS=$(date +%s)

              if (( NOW_SECONDS - START_SECONDS >= STARTUP_TIMEOUT )); then
                break
              fi

              sleep 0.1
            done

            if [[ "$READY" != "1" ]]; then
              echo "::error::JVM application did not become ready"
              echo "::error::Last HTTP status: ${LAST_STATUS}"
              cat /tmp/framework.log || true
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
              exit 1
            fi

            sleep 2

            RSS_KB=$(ps -o rss= -p "$PID" | tr -d ' ')

            if [[ -z "$RSS_KB" ]]; then
              echo "::error::Could not read JVM RSS"
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
              exit 1
            fi

            RSS_MB=$(awk -v rss="$RSS_KB" \
              'BEGIN { printf "%.2f", rss / 1024 }')

            echo "Startup: ${STARTUP_MS} ms"
            echo "Memory:  ${RSS_MB} MB"

            STARTUP_VALUES="${STARTUP_VALUES}${STARTUP_MS}"$'\n'
            MEMORY_VALUES="${MEMORY_VALUES}${RSS_MB}"$'\n'

            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            fuser -k "${PORT}/tcp" 2>/dev/null || true
            sleep 1
          done

          MEDIAN_STARTUP=$(echo "$STARTUP_VALUES" | sort -n | awk '
            NF { a[++n]=$1 }
            END {
              if (n % 2)
                print a[(n+1)/2]
              else
                printf "%.1f", (a[n/2]+a[n/2+1])/2
            }
          ')

          P95_STARTUP=$(echo "$STARTUP_VALUES" | sort -n | awk '
            NF { a[++n]=$1 }
            END {
              i=int(n*0.95+0.999)
              if (i<1) i=1
              print a[i]
            }
          ')

          MEDIAN_MEMORY=$(echo "$MEMORY_VALUES" | sort -n | awk '
            NF { a[++n]=$1 }
            END {
              if (n % 2)
                printf "%.2f", a[(n+1)/2]
              else
                printf "%.2f", (a[n/2]+a[n/2+1])/2
            }
          ')

          echo "startup_median_ms=${MEDIAN_STARTUP}" >> "$GITHUB_OUTPUT"
          echo "startup_p95_ms=${P95_STARTUP}" >> "$GITHUB_OUTPUT"
          echo "memory_median_mb=${MEDIAN_MEMORY}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # BENCHMARK NATIVE
      # -----------------------------------------------------------------------

      - name: Benchmark Native
        if: matrix.runtime == 'native'
        id: benchmark_native
        shell: bash
        run: |
          set -euo pipefail

          IS_CONTAINER=0
          CURL_HEADERS=()

          case "${{ matrix.framework }}" in
            Spring)
              ARTIFACT="${{ steps.artifact_spring.outputs.image }}"
              CURL_HEADERS=(-H "Accept: text/html")
              IS_CONTAINER=1
              ;;
            Quarkus)
              ARTIFACT="${{ steps.artifact_quarkus.outputs.artifact }}"
              CURL_HEADERS=(-H "Content-Type: text/html")
              ;;
            Ktor)
              ARTIFACT="${{ steps.artifact_ktor.outputs.artifact }}"
              ;;
            Http4k)
              ARTIFACT="${{ steps.http4k_native.outputs.artifact }}"
              ;;
            *)
              echo "::error::Unsupported native framework"
              exit 1
              ;;
          esac

          if [[ "$IS_CONTAINER" != "1" ]]; then
            chmod +x "$ARTIFACT"
          fi

          STARTUP_VALUES=""
          MEMORY_VALUES=""

          for RUN in $(seq 1 "$RUNS"); do
            echo
            echo "Native run ${RUN} / ${RUNS}"

            rm -f /tmp/framework.log

            START=$(date +%s%N)

            if [[ "$IS_CONTAINER" == "1" ]]; then
              CONTAINER_NAME="spring-native-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RUN}"

              docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

              docker run \
                --rm \
                --name "$CONTAINER_NAME" \
                --network host \
                --env "SERVER_PORT=${PORT}" \
                "$ARTIFACT" \
                > /tmp/framework.log 2>&1 &

              PID=$!
            else
              "$ARTIFACT" > /tmp/framework.log 2>&1 &
              PID=$!
            fi

            READY=0
            LAST_STATUS="none"
            START_SECONDS=$(date +%s)

            while true; do
              LAST_STATUS=$(curl \
                "${CURL_HEADERS[@]}" \
                --silent \
                --output /dev/null \
                --write-out '%{http_code}' \
                --connect-timeout 0.1 \
                --max-time 1 \
                "http://127.0.0.1:${PORT}/greet/John" || true)

              if [[ "$LAST_STATUS" == "200" ]]; then
                END=$(date +%s%N)
                STARTUP_MS=$(( (END - START) / 1000000 ))
                READY=1
                break
              fi

              if ! kill -0 "$PID" 2>/dev/null; then
                break
              fi

              NOW_SECONDS=$(date +%s)

              if (( NOW_SECONDS - START_SECONDS >= STARTUP_TIMEOUT )); then
                break
              fi

              sleep 0.1
            done

            if [[ "$READY" != "1" ]]; then
              echo "::error::Native application did not become ready"
              echo "::error::Last HTTP status: ${LAST_STATUS}"
              cat /tmp/framework.log || true

              if [[ "$IS_CONTAINER" == "1" ]]; then
                docker logs "$CONTAINER_NAME" 2>/dev/null || true
                docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
              else
                kill "$PID" 2>/dev/null || true
              fi

              wait "$PID" 2>/dev/null || true
              exit 1
            fi

            sleep 2

            if [[ "$IS_CONTAINER" == "1" ]]; then
              HOST_PID=$(docker inspect \
                --format '{{.State.Pid}}' \
                "$CONTAINER_NAME" 2>/dev/null || true)

              if [[ -z "$HOST_PID" || "$HOST_PID" == "0" ]]; then
                echo "::error::Could not determine Spring container process"
                docker logs "$CONTAINER_NAME" 2>/dev/null || true
                docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
                wait "$PID" 2>/dev/null || true
                exit 1
              fi

              RSS_KB=$(ps -o rss= -p "$HOST_PID" | tr -d ' ')
            else
              RSS_KB=$(ps -o rss= -p "$PID" | tr -d ' ')
            fi

            if [[ -z "$RSS_KB" ]]; then
              echo "::error::Could not read native RSS"

              if [[ "$IS_CONTAINER" == "1" ]]; then
                docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
              else
                kill "$PID" 2>/dev/null || true
              fi

              wait "$PID" 2>/dev/null || true
              exit 1
            fi

            RSS_MB=$(awk -v rss="$RSS_KB" \
              'BEGIN { printf "%.2f", rss / 1024 }')

            echo "Startup: ${STARTUP_MS} ms"
            echo "Memory:  ${RSS_MB} MB"

            STARTUP_VALUES="${STARTUP_VALUES}${STARTUP_MS}"$'\n'
            MEMORY_VALUES="${MEMORY_VALUES}${RSS_MB}"$'\n'

            if [[ "$IS_CONTAINER" == "1" ]]; then
              docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
            else
              kill "$PID" 2>/dev/null || true
            fi

            wait "$PID" 2>/dev/null || true
            fuser -k "${PORT}/tcp" 2>/dev/null || true
            sleep 1
          done

          MEDIAN_STARTUP=$(echo "$STARTUP_VALUES" | sort -n | awk '
            NF { a[++n]=$1 }
            END {
              if (n % 2)
                print a[(n+1)/2]
              else
                printf "%.1f", (a[n/2]+a[n/2+1])/2
            }
          ')

          P95_STARTUP=$(echo "$STARTUP_VALUES" | sort -n | awk '
            NF { a[++n]=$1 }
            END {
              i=int(n*0.95+0.999)
              if (i<1) i=1
              print a[i]
            }
          ')

          MEDIAN_MEMORY=$(echo "$MEMORY_VALUES" | sort -n | awk '
            NF { a[++n]=$1 }
            END {
              if (n % 2)
                printf "%.2f", a[(n+1)/2]
              else
                printf "%.2f", (a[n/2]+a[n/2+1])/2
            }
          ')

          echo "startup_median_ms=${MEDIAN_STARTUP}" >> "$GITHUB_OUTPUT"
          echo "startup_p95_ms=${P95_STARTUP}" >> "$GITHUB_OUTPUT"
          echo "memory_median_mb=${MEDIAN_MEMORY}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # HTTP LATENCY BENCHMARK
      # -----------------------------------------------------------------------

      - name: HTTP latency benchmark
        if: matrix.runtime == 'jvm' || matrix.runtime == 'native'
        id: http
        shell: bash
        run: |
          set -euo pipefail

          CURL_HEADERS=()
          IS_CONTAINER=0
          CONTAINER_NAME=""

          case "${{ matrix.framework }}" in
            Spring)
              CURL_HEADERS=(-H "Accept: text/html")
              ;;
            Quarkus)
              CURL_HEADERS=(-H "Content-Type: text/html")
              ;;
          esac

          rm -f /tmp/framework.log

          if [[ "${{ matrix.runtime }}" == "jvm" ]]; then
            ARTIFACT="${{ steps.artifact_jvm.outputs.artifact }}"

            (
              cd "${{ matrix.framework }}"
              java -jar "$ARTIFACT"
            ) > /tmp/framework.log 2>&1 &

            PID=$!
          else
            case "${{ matrix.framework }}" in
              Spring)
                ARTIFACT="${{ steps.artifact_spring.outputs.image }}"
                CONTAINER_NAME="spring-native-http-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

                docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

                docker run \
                  --rm \
                  --name "$CONTAINER_NAME" \
                  --network host \
                  --env "SERVER_PORT=${PORT}" \
                  "$ARTIFACT" \
                  > /tmp/framework.log 2>&1 &

                PID=$!
                IS_CONTAINER=1
                ;;

              Quarkus)
                ARTIFACT="${{ steps.artifact_quarkus.outputs.artifact }}"
                chmod +x "$ARTIFACT"
                "$ARTIFACT" > /tmp/framework.log 2>&1 &
                PID=$!
                ;;

              Ktor)
                ARTIFACT="${{ steps.artifact_ktor.outputs.artifact }}"
                chmod +x "$ARTIFACT"
                "$ARTIFACT" > /tmp/framework.log 2>&1 &
                PID=$!
                ;;

              Http4k)
                ARTIFACT="${{ steps.http4k_native.outputs.artifact }}"
                chmod +x "$ARTIFACT"
                "$ARTIFACT" > /tmp/framework.log 2>&1 &
                PID=$!
                ;;

              *)
                echo "::error::Unsupported native framework"
                exit 1
                ;;
            esac
          fi

          cleanup() {
            if [[ "$IS_CONTAINER" == "1" ]]; then
              docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
            else
              kill "$PID" 2>/dev/null || true
            fi

            wait "$PID" 2>/dev/null || true
            fuser -k "${PORT}/tcp" 2>/dev/null || true
          }

          trap cleanup EXIT

          READY=0
          LAST_STATUS="none"
          START_SECONDS=$(date +%s)

          while true; do
            LAST_STATUS=$(curl \
              "${CURL_HEADERS[@]}" \
              --silent \
              --output /dev/null \
              --write-out '%{http_code}' \
              --connect-timeout 0.1 \
              --max-time 1 \
              "http://127.0.0.1:${PORT}/greet/John" || true)

            if [[ "$LAST_STATUS" == "200" ]]; then
              READY=1
              break
            fi

            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi

            NOW_SECONDS=$(date +%s)

            if (( NOW_SECONDS - START_SECONDS >= STARTUP_TIMEOUT )); then
              break
            fi

            sleep 0.1
          done

          if [[ "$READY" != "1" ]]; then
            echo "::error::Application did not become ready"
            echo "::error::Last HTTP status: ${LAST_STATUS}"
            cat /tmp/framework.log || true

            if [[ "$IS_CONTAINER" == "1" ]]; then
              docker logs "$CONTAINER_NAME" 2>/dev/null || true
            fi

            exit 1
          fi

          for i in $(seq 1 20); do
            curl \
              "${CURL_HEADERS[@]}" \
              --silent \
              --fail \
              --output /dev/null \
              "http://127.0.0.1:${PORT}/greet/John"
          done

          VALUES=""

          for i in $(seq 1 100); do
            TIME_SECONDS=$(curl \
              "${CURL_HEADERS[@]}" \
              --silent \
              --fail \
              --output /dev/null \
              --write-out '%{time_total}' \
              "http://127.0.0.1:${PORT}/greet/John")

            VALUES="${VALUES}${TIME_SECONDS}"$'\n'
          done

          AVG_MS=$(echo "$VALUES" | awk '
            NF {
              sum += $1
              count++
            }
            END {
              if (count > 0)
                printf "%.3f", (sum/count) * 1000
              else
                printf "0.000"
            }
          ')

          MEDIAN_MS=$(echo "$VALUES" | sort -n | awk '
            NF { a[++n]=$1 }
            END {
              if (n == 0)
                printf "0.000"
              else if (n % 2)
                printf "%.3f", a[(n+1)/2] * 1000
              else
                printf "%.3f", ((a[n/2]+a[n/2+1])/2) * 1000
            }
          ')

          P95_MS=$(echo "$VALUES" | sort -n | awk '
            NF { a[++n]=$1 }
            END {
              if (n == 0) {
                printf "0.000"
              } else {
                i=int(n*0.95+0.999)
                if (i<1) i=1
                printf "%.3f", a[i] * 1000
              }
            }
          ')

          echo "HTTP average: ${AVG_MS} ms"
          echo "HTTP median:  ${MEDIAN_MS} ms"
          echo "HTTP P95:     ${P95_MS} ms"

          echo "avg_ms=${AVG_MS}" >> "$GITHUB_OUTPUT"
          echo "median_ms=${MEDIAN_MS}" >> "$GITHUB_OUTPUT"
          echo "p95_ms=${P95_MS}" >> "$GITHUB_OUTPUT"

          cleanup
          trap - EXIT

      # -----------------------------------------------------------------------
      # CREATE RESULT JSON
      # -----------------------------------------------------------------------

      - name: Create result JSON
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p results

          FRAMEWORK="${{ matrix.framework }}"
          RUNTIME="${{ matrix.runtime }}"

          if [[ "$RUNTIME" == "jvm" ]]; then
            BUILD="${{ steps.build_jvm.outputs.build_ms || 0 }}"
            ARTIFACT="${{ steps.artifact_jvm.outputs.size_mb || 0 }}"
            STARTUP="${{ steps.benchmark_jvm.outputs.startup_median_ms || 0 }}"
            STARTUP_P95="${{ steps.benchmark_jvm.outputs.startup_p95_ms || 0 }}"
            MEMORY="${{ steps.benchmark_jvm.outputs.memory_median_mb || 0 }}"
          else
            BUILD="${{ steps.build_native.outputs.build_ms || 0 }}"
            STARTUP="${{ steps.benchmark_native.outputs.startup_median_ms || 0 }}"
            STARTUP_P95="${{ steps.benchmark_native.outputs.startup_p95_ms || 0 }}"
            MEMORY="${{ steps.benchmark_native.outputs.memory_median_mb || 0 }}"

            case "$FRAMEWORK" in
              Spring)
                ARTIFACT="${{ steps.artifact_spring.outputs.size_mb || 0 }}"
                ;;
              Quarkus)
                ARTIFACT="${{ steps.artifact_quarkus.outputs.size_mb || 0 }}"
                ;;
              Ktor)
                ARTIFACT="${{ steps.artifact_ktor.outputs.size_mb || 0 }}"
                ;;
              Http4k)
                ARTIFACT="${{ steps.http4k_native.outputs.size_mb || 0 }}"
                ;;
              *)
                ARTIFACT="0"
                ;;
            esac
          fi

          HTTP_AVG="${{ steps.http.outputs.avg_ms || 0 }}"
          HTTP_MEDIAN="${{ steps.http.outputs.median_ms || 0 }}"
          HTTP_P95="${{ steps.http.outputs.p95_ms || 0 }}"

          cat > "results/${FRAMEWORK}-${RUNTIME}.json" <<EOF
          {
            "framework": "$FRAMEWORK",
            "runtime": "$RUNTIME",
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "runner": "${RUNNER_OS}",
            "java_version": "${JAVA_VERSION}",
            "measurements": ${RUNS},
            "build_time_ms": ${BUILD},
            "artifact_size_mb": ${ARTIFACT},
            "startup_median_ms": ${STARTUP},
            "startup_p95_ms": ${STARTUP_P95},
            "memory_median_mb": ${MEMORY},
            "http_average_ms": ${HTTP_AVG},
            "http_median_ms": ${HTTP_MEDIAN},
            "http_p95_ms": ${HTTP_P95}
          }
          EOF

          cat "results/${FRAMEWORK}-${RUNTIME}.json"

      - name: Upload individual result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.framework }}-${{ matrix.runtime }}
          path: results/
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup Spring native image
        if: always() && matrix.runtime == 'native' && matrix.framework == 'Spring'
        shell: bash
        run: |
          set -euo pipefail

          docker ps -aq \
            --filter "ancestor=$SPRING_NATIVE_IMAGE" |
            xargs -r docker rm -f || true

          docker image rm -f "$SPRING_NATIVE_IMAGE" || true

  # ===========================================================================
  # REPORT
  # ===========================================================================

  report:
    name: Generate benchmark report
    runs-on: ubuntu-latest
    needs: benchmark
    if: always()

    steps:
      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: downloaded
          merge-multiple: true

      - name: Generate combined report
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports

          jq -s '.' downloaded/*.json > reports/results.json

          cat > reports/results.md <<EOF
          # Web Framework Benchmark

          **Run:** ${GITHUB_RUN_NUMBER}

          **Commit:** \`${GITHUB_SHA}\`

          **Measurements per runtime:** ${RUNS}

          > For Spring Native, artifact size represents the complete container
          > image size. For the other native runtimes, it represents the native
          > executable size.

          ## Results

          | Framework | Runtime | Build | Artifact | Startup median | Startup P95 | Memory median | HTTP avg | HTTP P95 |
          |---|---|---:|---:|---:|---:|---:|---:|---:|
          EOF

          jq -r '
            sort_by(.framework, .runtime)[] |
            "| \(.framework) | \(.runtime) | \(.build_time_ms) ms | \(.artifact_size_mb) MB | \(.startup_median_ms) ms | \(.startup_p95_ms) ms | \(.memory_median_mb) MB | \(.http_average_ms) ms | \(.http_p95_ms) ms |"
          ' reports/results.json >> reports/results.md

          cat reports/results.md

      - name: Add report to GitHub Summary
        shell: bash
        run: |
          set -euo pipefail

          cat reports/results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            reports/results.md
            reports/results.json
          retention-days: 90
          if-no-files-found: error
