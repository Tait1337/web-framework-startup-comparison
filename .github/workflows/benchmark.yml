name: Web Framework Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRAALVM_VERSION: "17"
  PORT: "8080"
  RUNS: "7"
  STARTUP_TIMEOUT: "120"

jobs:
  benchmark:
    name: ${{ matrix.framework }} / ${{ matrix.runtime }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        framework:
          - Spring
          - Quarkus
          - Ktor
          - Http4k
        runtime:
          - jvm
          - native
        exclude:
          # Spring native creates a container image, not a directly executable
          # artifact. It is therefore not included in this benchmark.
          - framework: Spring
            runtime: native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Gradle wrapper executable
        shell: bash
        run: |
          set -euo pipefail

          chmod +x \
            Spring/gradlew \
            Quarkus/gradlew \
            Ktor/gradlew \
            Http4k/gradlew

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      # Quarkus 2.9.2 requires an older GraalVM/Mandrel version and is built
      # inside its compatible builder container instead. Ktor and Http4k use
      # the GraalVM installed directly on the GitHub Actions runner.
      - name: Setup GraalVM
        if: matrix.runtime == 'native' && matrix.framework != 'Quarkus'
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.GRAALVM_VERSION }}
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: gradle

      - name: Show environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Framework: ${{ matrix.framework }}"
          echo "Runtime:   ${{ matrix.runtime }}"
          echo

          java -version

          echo
          native-image --version 2>/dev/null || true

          echo
          docker --version 2>/dev/null || true

          echo
          nproc

          free -h

      # -----------------------------------------------------------------------
      # JVM BUILD
      # -----------------------------------------------------------------------

      - name: Build JVM
        if: matrix.runtime == 'jvm'
        id: build_jvm
        working-directory: ${{ matrix.framework }}
        shell: bash
        run: |
          set -euo pipefail

          START=$(date +%s%N)

          case "${{ matrix.framework }}" in
            Ktor|Http4k)
              # Produce an executable fat JAR containing all dependencies
              # and the Main-Class manifest entry.
              ./gradlew clean build shadowJar --no-daemon
              ;;
            *)
              ./gradlew clean build --no-daemon
              ;;
          esac

          END=$(date +%s%N)
          BUILD_MS=$(( (END - START) / 1000000 ))

          echo "Build time: ${BUILD_MS} ms"
          echo "build_ms=${BUILD_MS}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # NATIVE BUILD
      #
      # For Ktor this step now includes BOTH:
      #
      #   1. Gradle shadowJar
      #   2. GraalVM native-image
      #
      # Therefore build_time_ms represents the complete Ktor native build.
      # -----------------------------------------------------------------------

      - name: Build Native
        if: matrix.runtime == 'native'
        id: build_native
        working-directory: ${{ matrix.framework }}
        shell: bash
        run: |
          set -euo pipefail

          START=$(date +%s%N)

          case "${{ matrix.framework }}" in
            Quarkus)
              # GraalVM 22.0's Java 17 runtime can crash while detecting
              # cgroup v2 metrics on modern GitHub Actions Docker hosts.
              #
              # -J forwards the option to the JVM running native-image.
              # Disabling UseContainerSupport avoids the broken cgroup probe.
              ./gradlew clean build \
                -Dquarkus.package.type=native \
                -Dquarkus.native.container-build=true \
                -Dquarkus.native.additional-build-args=-J-XX:-UseContainerSupport \
                --no-daemon
              ;;

            Ktor)
              echo "========================================"
              echo "Building Ktor executable fat JAR"
              echo "========================================"

              ./gradlew clean shadowJar --no-daemon

              JAR=$(find build/libs \
                -maxdepth 1 \
                -type f \
                -name "*-all.jar" \
                -print \
                -quit)

              if [[ -z "${JAR:-}" || ! -f "$JAR" ]]; then
                echo "::error::Could not find Ktor executable fat JAR"
                echo "::error::Expected a file matching build/libs/*-all.jar"
                find build/libs \
                  -maxdepth 1 \
                  -type f \
                  -printf '%p\n' |
                  sort
                exit 1
              fi

              echo "Ktor fat JAR: $JAR"

              if ! unzip -p "$JAR" META-INF/MANIFEST.MF |
                grep -qi '^Main-Class:'; then
                echo "::error::Ktor fat JAR has no Main-Class manifest entry"
                echo
                echo "Manifest:"
                unzip -p "$JAR" META-INF/MANIFEST.MF || true
                exit 1
              fi

              if [[ ! -f "graal-reflection-configuration.json" ]]; then
                echo "::error::Missing Ktor GraalVM reflection configuration"
                echo "::error::Expected: Ktor/graal-reflection-configuration.json"
                exit 1
              fi

              echo
              echo "========================================"
              echo "Building Ktor GraalVM native executable"
              echo "========================================"

              echo "GraalVM:"
              native-image --version

              echo
              echo "Input:"
              echo "  $JAR"

              echo
              echo "GraalVM configuration:"
              echo "  --no-fallback"
              echo "  --static"
              echo "  -H:IncludeResources=(.*.properties)|(static/.*)|(META-INF/.*)"
              echo "  -H:ReflectionConfigurationFiles=graal-reflection-configuration.json"
              echo "  --allow-incomplete-classpath"
              echo "  --initialize-at-build-time=io.ktor,kotlinx,kotlin"

              # This intentionally mirrors the native-image invocation from
              # Ktor/Dockerfile.
              #
              # Dockerfile:
              #
              # native-image \
              #   --no-fallback \
              #   --static \
              #   -H:IncludeResources="(.*.properties)|(static/.*)|(META-INF/.*)" \
              #   -H:ReflectionConfigurationFiles=graal-reflection-configuration.json \
              #   --allow-incomplete-classpath \
              #   --initialize-at-build-time=io.ktor,kotlinx,kotlin \
              #   -jar app.jar
              #
              native-image \
                --no-fallback \
                --static \
                --enable-url-protocols=http \
                -H:+ReportExceptionStackTraces \
                -H:IncludeResources="(.*.properties)|(static/.*)|(META-INF/.*)" \
                -H:ReflectionConfigurationFiles=graal-reflection-configuration.json \
                --allow-incomplete-classpath \
                --initialize-at-build-time=io.ktor,kotlinx,kotlin \
                -jar "$JAR" \
                app

              if [[ ! -x "app" ]]; then
                echo "::error::Ktor native executable was not created"
                find . -maxdepth 2 -type f -printf '%p\n' | sort
                exit 1
              fi

              chmod +x app

              SIZE_BYTES=$(stat -c%s app)
              SIZE_MB=$(awk -v bytes="$SIZE_BYTES" \
                'BEGIN { printf "%.2f", bytes / 1024 / 1024 }')

              echo
              echo "Ktor native executable:"
              echo "  app"
              echo "  ${SIZE_BYTES} bytes"
              echo "  ${SIZE_MB} MB"

              # Export the native artifact directly from this build step.
              echo "artifact=$PWD/app" >> "$GITHUB_OUTPUT"
              echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
              echo "size_mb=$SIZE_MB"
              echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"
              ;;

            Http4k)
              ./gradlew clean shadowJar --no-daemon
              ;;

            *)
              echo "::error::Unsupported native framework: ${{ matrix.framework }}"
              exit 1
              ;;
          esac

          END=$(date +%s%N)
          BUILD_MS=$(( (END - START) / 1000000 ))

          echo
          echo "Total native build time: ${BUILD_MS} ms"

          echo "build_ms=${BUILD_MS}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # FIND JVM ARTIFACT
      # -----------------------------------------------------------------------

      - name: Find JVM artifact
        if: matrix.runtime == 'jvm'
        id: artifact_jvm
        working-directory: ${{ matrix.framework }}
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.framework }}" in
            Spring)
              ARTIFACT=$(find build/libs \
                -type f \
                -name "*.jar" \
                ! -name "*plain.jar" \
                | head -n 1)

              if [[ -z "${ARTIFACT:-}" || ! -f "$ARTIFACT" ]]; then
                echo "::error::Could not find Spring JVM artifact"
                find build -type f | sort
                exit 1
              fi

              SIZE_BYTES=$(stat -c%s "$ARTIFACT")
              SIZE_DESCRIPTION="$ARTIFACT"
              ;;

            Quarkus)
              # Quarkus fast-jar applications require the complete
              # build/quarkus-app directory, not only quarkus-run.jar.
              APP_DIR="build/quarkus-app"
              ARTIFACT="${APP_DIR}/quarkus-run.jar"

              if [[ ! -f "$ARTIFACT" ]]; then
                echo "::error::Could not find Quarkus JVM launcher: $ARTIFACT"
                find build -type f | sort
                exit 1
              fi

              # Sum the logical size of every file in the Quarkus
              # distribution, including app/, lib/ and quarkus/.
              SIZE_BYTES=$(find "$APP_DIR" -type f -printf '%s\n' |
                awk '{ total += $1 } END { printf "%.0f", total }')

              SIZE_DESCRIPTION="$APP_DIR (complete Quarkus distribution)"
              ;;

            Ktor|Http4k)
              # Ktor and Http4k require the executable fat JAR generated
              # by shadowJar. Do not select the normal non-executable JAR.
              ARTIFACT=$(find build/libs \
                -maxdepth 1 \
                -type f \
                -name "*-all.jar" \
                -print \
                -quit)

              if [[ -z "${ARTIFACT:-}" || ! -f "$ARTIFACT" ]]; then
                echo "::error::Could not find executable ${{ matrix.framework }} fat JAR"
                echo "::error::Expected a file matching build/libs/*-all.jar"
                find build/libs \
                  -maxdepth 1 \
                  -type f \
                  -printf '%p\n' |
                  sort
                exit 1
              fi

              # Verify that java -jar can determine the application's
              # entry point before running the benchmark.
              if ! unzip -p "$ARTIFACT" META-INF/MANIFEST.MF |
                grep -qi '^Main-Class:'; then
                echo "::error::The fat JAR has no Main-Class manifest entry: $ARTIFACT"
                unzip -p "$ARTIFACT" META-INF/MANIFEST.MF || true
                exit 1
              fi

              SIZE_BYTES=$(stat -c%s "$ARTIFACT")
              SIZE_DESCRIPTION="$ARTIFACT (executable fat JAR)"
              ;;

            *)
              echo "::error::Unsupported JVM framework: ${{ matrix.framework }}"
              exit 1
              ;;
          esac

          if [[ -z "${SIZE_BYTES:-}" || "$SIZE_BYTES" -le 0 ]]; then
            echo "::error::Could not determine JVM artifact size"
            exit 1
          fi

          SIZE_MB=$(awk -v bytes="$SIZE_BYTES" \
            'BEGIN { printf "%.2f", bytes / 1024 / 1024 }')

          echo "Launcher: $ARTIFACT"
          echo "Measured artifact: $SIZE_DESCRIPTION"
          echo "Size: ${SIZE_BYTES} bytes (${SIZE_MB} MB)"

          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # FIND QUARKUS NATIVE ARTIFACT
      # -----------------------------------------------------------------------

      - name: Find Quarkus native artifact
        if: matrix.runtime == 'native' && matrix.framework == 'Quarkus'
        id: artifact_quarkus
        working-directory: Quarkus
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT=$(find build \
            -type f \
            \( -name "*-runner" -o -name "app" \) \
            ! -name "*.jar" \
            | head -n 1)

          if [[ -z "${ARTIFACT:-}" || ! -f "$ARTIFACT" ]]; then
            echo "::error::Could not find Quarkus native executable"
            find build -type f -printf '%M %p\n' | sort
            exit 1
          fi

          chmod +x "$ARTIFACT"

          SIZE_BYTES=$(stat -c%s "$ARTIFACT")
          SIZE_MB=$(awk "BEGIN { printf \"%.2f\", ${SIZE_BYTES}/1024/1024 }")

          echo "Artifact: $ARTIFACT"
          echo "Size: ${SIZE_MB} MB"

          echo "artifact=$PWD/$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # FIND KTOR NATIVE ARTIFACT
      #
      # The actual GraalVM build was already performed inside Build Native.
      # This step only validates and exposes the artifact.
      # -----------------------------------------------------------------------

      - name: Find Ktor native artifact
        if: matrix.runtime == 'native' && matrix.framework == 'Ktor'
        id: artifact_ktor
        working-directory: Ktor
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT="app"

          if [[ ! -f "$ARTIFACT" ]]; then
            echo "::error::Could not find Ktor native executable"
            echo "::error::Expected: Ktor/app"
            find . -maxdepth 2 -type f -printf '%p\n' | sort
            exit 1
          fi

          if [[ ! -x "$ARTIFACT" ]]; then
            chmod +x "$ARTIFACT"
          fi

          SIZE_BYTES=$(stat -c%s "$ARTIFACT")
          SIZE_MB=$(awk -v bytes="$SIZE_BYTES" \
            'BEGIN { printf "%.2f", bytes / 1024 / 1024 }')

          echo "Artifact: $PWD/$ARTIFACT"
          echo "Size: ${SIZE_BYTES} bytes (${SIZE_MB} MB)"

          echo "artifact=$PWD/$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # BUILD HTTP4K NATIVE EXECUTABLE
      # -----------------------------------------------------------------------

      - name: Build Http4k native executable
        if: matrix.runtime == 'native' && matrix.framework == 'Http4k'
        id: http4k_native
        working-directory: Http4k
        shell: bash
        run: |
          set -euo pipefail

          JAR=$(find build/libs \
            -maxdepth 1 \
            -type f \
            -name "*-all.jar" \
            -print \
            -quit)

          if [[ -z "${JAR:-}" || ! -f "$JAR" ]]; then
            echo "::error::Could not find Http4k executable fat JAR"
            echo "::error::Expected a file matching build/libs/*-all.jar"

            if [[ -d build/libs ]]; then
              find build/libs \
                -maxdepth 1 \
                -type f \
                -printf '%M %s %p\n' |
                sort || true
            else
              echo "::error::Directory does not exist: $PWD/build/libs"
            fi

            exit 1
          fi

          echo "Http4k fat JAR: $PWD/$JAR"

          if ! unzip -p "$JAR" META-INF/MANIFEST.MF |
            grep -qi '^Main-Class:'; then
            echo "::error::Http4k fat JAR has no Main-Class manifest entry"
            echo "::error::Artifact: $PWD/$JAR"

            echo
            echo "Manifest:"
            unzip -p "$JAR" META-INF/MANIFEST.MF || true

            exit 1
          fi

          CONFIG_DIR="$PWD/build/native-image-config"
          AGENT_LOG="$PWD/build/native-image-agent.log"

          rm -rf "$CONFIG_DIR"
          mkdir -p "$CONFIG_DIR"
          rm -f "$AGENT_LOG"

          echo
          echo "Generating native-image configuration for Http4k and Jackson..."

          java \
            -agentlib:native-image-agent=config-output-dir="$CONFIG_DIR" \
            -jar "$JAR" \
            > "$AGENT_LOG" 2>&1 &

          AGENT_PID=$!

          cleanup_agent() {
            if kill -0 "$AGENT_PID" 2>/dev/null; then
              kill -TERM "$AGENT_PID" 2>/dev/null || true

              for i in $(seq 1 15); do
                if ! kill -0 "$AGENT_PID" 2>/dev/null; then
                  break
                fi

                sleep 1
              done

              if kill -0 "$AGENT_PID" 2>/dev/null; then
                kill -KILL "$AGENT_PID" 2>/dev/null || true
              fi
            fi

            wait "$AGENT_PID" 2>/dev/null || true
            fuser -k "${PORT}/tcp" 2>/dev/null || true
          }

          trap cleanup_agent EXIT

          READY=0
          LAST_STATUS="none"

          for SECOND in $(seq 1 "$STARTUP_TIMEOUT"); do
            LAST_STATUS=$(curl \
              --silent \
              --output /dev/null \
              --write-out '%{http_code}' \
              --max-time 1 \
              "http://127.0.0.1:${PORT}/greet/John" || true)

            if [[ "$LAST_STATUS" == "200" ]]; then
              READY=1
              echo "Http4k became ready after ${SECOND} second(s)"
              break
            fi

            if ! kill -0 "$AGENT_PID" 2>/dev/null; then
              echo "::error::Http4k process exited while waiting for readiness"
              break
            fi

            sleep 1
          done

          if [[ "$READY" != "1" ]]; then
            echo "::error::Http4k did not become ready while generating native-image configuration"
            echo "::error::Last HTTP status: ${LAST_STATUS}"

            echo
            echo "Native-image agent application log:"
            cat "$AGENT_LOG" || true

            exit 1
          fi

          # Exercise the endpoint repeatedly so the native-image agent observes
          # Jackson, jackson-module-kotlin, Kotlin reflection and the response DTO.
          for i in $(seq 1 20); do
            RESPONSE=$(curl \
              --silent \
              --show-error \
              --fail \
              "http://127.0.0.1:${PORT}/greet/John")

            echo "Agent request ${i}: ${RESPONSE}"
          done

          # Stop the instrumented JVM gracefully so the native-image agent
          # writes its configuration files.
          cleanup_agent
          trap - EXIT

          echo
          echo "Generated native-image configuration files:"

          find "$CONFIG_DIR" \
            -maxdepth 1 \
            -type f \
            -printf '%M %s %p\n' |
            sort || true

          if [[ ! -f "$CONFIG_DIR/reflect-config.json" ]]; then
            echo "::error::The native-image agent did not generate reflect-config.json"
            echo "::error::Expected: $CONFIG_DIR/reflect-config.json"

            echo
            echo "Native-image agent application log:"
            cat "$AGENT_LOG" || true

            exit 1
          fi

          echo
          echo "Building Http4k native executable..."

          # Keep one canonical path for validation, measurement and outputs.
          OUTPUT="$PWD/app"

          # Prevent a stale executable from making validation pass when the
          # current native-image invocation did not produce a new artifact.
          rm -f "$OUTPUT"

          if ! native-image \
            --no-fallback \
            --enable-url-protocols=http \
            -H:+ReportExceptionStackTraces \
            -H:ConfigurationFileDirectories="$CONFIG_DIR" \
            -jar "$JAR" \
            app; then
            echo "::error::Http4k native-image compilation failed"

            echo
            echo "Files present after the failed native-image invocation:"
            find "$PWD" \
              -maxdepth 2 \
              -type f \
              -printf '%M %s %p\n' |
              sort || true

            exit 1
          fi

          # Check existence before chmod. With `set -e`, calling chmod first
          # would terminate the step immediately if native-image did not create
          # the expected file, hiding the more useful diagnostic message below.
          if [[ ! -f "$OUTPUT" ]]; then
            echo "::error::Http4k native-image completed without creating the expected executable"
            echo "::error::Expected output: $OUTPUT"

            echo
            echo "Files present after native-image completed:"
            find "$PWD" \
              -maxdepth 2 \
              -type f \
              -printf '%M %s %p\n' |
              sort || true

            exit 1
          fi

          if [[ ! -s "$OUTPUT" ]]; then
            echo "::error::Http4k native executable exists but is empty"
            echo "::error::Artifact: $OUTPUT"
            ls -l "$OUTPUT" || true
            exit 1
          fi

          if ! chmod +x "$OUTPUT"; then
            echo "::error::Could not make the Http4k native executable executable"
            echo "::error::Artifact: $OUTPUT"
            ls -l "$OUTPUT" || true
            exit 1
          fi

          if [[ ! -x "$OUTPUT" ]]; then
            echo "::error::Http4k native artifact is still not executable after chmod"
            echo "::error::Artifact: $OUTPUT"
            ls -l "$OUTPUT" || true
            exit 1
          fi

          echo
          echo "Native executable details:"
          ls -lh "$OUTPUT"
          file "$OUTPUT" || true

          SIZE_BYTES=$(stat -c%s "$OUTPUT")
          SIZE_MB=$(awk -v bytes="$SIZE_BYTES" \
            'BEGIN { printf "%.2f", bytes / 1024 / 1024 }')

          echo
          echo "Http4k native executable:"
          echo "  Path: $OUTPUT"
          echo "  Size: ${SIZE_BYTES} bytes"
          echo "  Size: ${SIZE_MB} MB"

          echo "artifact=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # BENCHMARK JVM
      # -----------------------------------------------------------------------

      - name: Benchmark JVM
        if: matrix.runtime == 'jvm'
        id: benchmark_jvm
        working-directory: ${{ matrix.framework }}
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT="${{ steps.artifact_jvm.outputs.artifact }}"

          CURL_HEADERS=()

          case "${{ matrix.framework }}" in
            Spring)
              CURL_HEADERS=(-H "Accept: text/html")
              ;;
            Quarkus)
              CURL_HEADERS=(-H "Content-Type: text/html")
              ;;
          esac

          STARTUP_VALUES=""
          MEMORY_VALUES=""

          for RUN in $(seq 1 "$RUNS"); do
            echo
            echo "JVM run ${RUN} / ${RUNS}"

            rm -f /tmp/framework.log

            START=$(date +%s%N)

            java -jar "$ARTIFACT" \
              > /tmp/framework.log 2>&1 &

            PID=$!
            READY=0
            LAST_STATUS="none"

            for SECOND in $(seq 1 "$STARTUP_TIMEOUT"); do
              LAST_STATUS=$(curl \
                "${CURL_HEADERS[@]}" \
                --silent \
                --output /dev/null \
                --write-out '%{http_code}' \
                --max-time 1 \
                "http://127.0.0.1:${PORT}/greet/John" || true)

              if [[ "$LAST_STATUS" == "200" ]]; then
                END=$(date +%s%N)
                STARTUP_MS=$(( (END - START) / 1000000 ))
                READY=1
                break
              fi

              if ! kill -0 "$PID" 2>/dev/null; then
                break
              fi

              sleep 1
            done

            if [[ "$READY" != "1" ]]; then
              echo "::error::JVM application did not become ready"
              echo "::error::Last HTTP status: ${LAST_STATUS}"
              cat /tmp/framework.log || true
              kill "$PID" 2>/dev/null || true
              exit 1
            fi

            sleep 2

            RSS_KB=$(ps -o rss= -p "$PID" | tr -d ' ')

            if [[ -z "$RSS_KB" ]]; then
              echo "::error::Could not read JVM RSS"
              kill "$PID" 2>/dev/null || true
              exit 1
            fi

            RSS_MB=$(awk "BEGIN { printf \"%.2f\", ${RSS_KB}/1024 }")

            echo "Startup: ${STARTUP_MS} ms"
            echo "Memory:  ${RSS_MB} MB"

            STARTUP_VALUES="${STARTUP_VALUES}${STARTUP_MS}"$'\n'
            MEMORY_VALUES="${MEMORY_VALUES}${RSS_MB}"$'\n'

            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            fuser -k "${PORT}/tcp" 2>/dev/null || true
            sleep 1
          done

          MEDIAN_STARTUP=$(echo "$STARTUP_VALUES" | sort -n | awk '
            NF { a[++n]=$1 }
            END {
              if (n % 2)
                print a[(n+1)/2]
              else
                printf "%.1f", (a[n/2]+a[n/2+1])/2
            }
          ')

          P95_STARTUP=$(echo "$STARTUP_VALUES" | sort -n | awk '
            NF { a[++n]=$1 }
            END {
              i=int(n*0.95+0.999)
              if (i<1) i=1
              print a[i]
            }
          ')

          MEDIAN_MEMORY=$(echo "$MEMORY_VALUES" | sort -n | awk '
            NF { a[++n]=$1 }
            END {
              if (n % 2)
                printf "%.2f", a[(n+1)/2]
              else
                printf "%.2f", (a[n/2]+a[n/2+1])/2
            }
          ')

          echo "startup_median_ms=${MEDIAN_STARTUP}" >> "$GITHUB_OUTPUT"
          echo "startup_p95_ms=${P95_STARTUP}" >> "$GITHUB_OUTPUT"
          echo "memory_median_mb=${MEDIAN_MEMORY}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # BENCHMARK NATIVE
      # -----------------------------------------------------------------------

      - name: Benchmark Native
        if: matrix.runtime == 'native'
        id: benchmark_native
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.framework }}" in
            Quarkus)
              ARTIFACT="${{ steps.artifact_quarkus.outputs.artifact }}"
              CURL_HEADERS=(-H "Content-Type: text/html")
              ;;
            Ktor)
              ARTIFACT="${{ steps.artifact_ktor.outputs.artifact }}"
              CURL_HEADERS=()
              ;;
            Http4k)
              ARTIFACT="${{ steps.http4k_native.outputs.artifact }}"
              CURL_HEADERS=()
              ;;
            *)
              echo "::error::Unsupported native framework"
              exit 1
              ;;
          esac

          chmod +x "$ARTIFACT"

          STARTUP_VALUES=""
          MEMORY_VALUES=""

          for RUN in $(seq 1 "$RUNS"); do
            echo
            echo "Native run ${RUN} / ${RUNS}"

            rm -f /tmp/framework.log

            START=$(date +%s%N)

            "$ARTIFACT" \
              > /tmp/framework.log 2>&1 &

            PID=$!
            READY=0
            LAST_STATUS="none"

            for SECOND in $(seq 1 "$STARTUP_TIMEOUT"); do
              LAST_STATUS=$(curl \
                "${CURL_HEADERS[@]}" \
                --silent \
                --output /dev/null \
                --write-out '%{http_code}' \
                --max-time 1 \
                "http://127.0.0.1:${PORT}/greet/John" || true)

              if [[ "$LAST_STATUS" == "200" ]]; then
                END=$(date +%s%N)
                STARTUP_MS=$(( (END - START) / 1000000 ))
                READY=1
                break
              fi

              if ! kill -0 "$PID" 2>/dev/null; then
                break
              fi

              sleep 1
            done

            if [[ "$READY" != "1" ]]; then
              echo "::error::Native application did not become ready"
              echo "::error::Last HTTP status: ${LAST_STATUS}"
              cat /tmp/framework.log || true
              kill "$PID" 2>/dev/null || true
              exit 1
            fi

            sleep 2

            RSS_KB=$(ps -o rss= -p "$PID" | tr -d ' ')

            if [[ -z "$RSS_KB" ]]; then
              echo "::error::Could not read native RSS"
              kill "$PID" 2>/dev/null || true
              exit 1
            fi

            RSS_MB=$(awk "BEGIN { printf \"%.2f\", ${RSS_KB}/1024 }")

            echo "Startup: ${STARTUP_MS} ms"
            echo "Memory:  ${RSS_MB} MB"

            STARTUP_VALUES="${STARTUP_VALUES}${STARTUP_MS}"$'\n'
            MEMORY_VALUES="${MEMORY_VALUES}${RSS_MB}"$'\n'

            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
            fuser -k "${PORT}/tcp" 2>/dev/null || true
            sleep 1
          done

          MEDIAN_STARTUP=$(echo "$STARTUP_VALUES" | sort -n | awk '
            NF { a[++n]=$1 }
            END {
              if (n % 2)
                print a[(n+1)/2]
              else
                printf "%.1f", (a[n/2]+a[n/2+1])/2
            }
          ')

          P95_STARTUP=$(echo "$STARTUP_VALUES" | sort -n | awk '
            NF { a[++n]=$1 }
            END {
              i=int(n*0.95+0.999)
              if (i<1) i=1
              print a[i]
            }
          ')

          MEDIAN_MEMORY=$(echo "$MEMORY_VALUES" | sort -n | awk '
            NF { a[++n]=$1 }
            END {
              if (n % 2)
                printf "%.2f", a[(n+1)/2]
              else
                printf "%.2f", (a[n/2]+a[n/2+1])/2
            }
          ')

          echo "startup_median_ms=${MEDIAN_STARTUP}" >> "$GITHUB_OUTPUT"
          echo "startup_p95_ms=${P95_STARTUP}" >> "$GITHUB_OUTPUT"
          echo "memory_median_mb=${MEDIAN_MEMORY}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # HTTP LATENCY BENCHMARK
      # -----------------------------------------------------------------------

      - name: HTTP latency benchmark
        if: matrix.runtime == 'jvm' || matrix.runtime == 'native'
        id: http
        shell: bash
        run: |
          set -euo pipefail

          CURL_HEADERS=()

          case "${{ matrix.framework }}" in
            Spring)
              CURL_HEADERS=(-H "Accept: text/html")
              ;;
            Quarkus)
              CURL_HEADERS=(-H "Content-Type: text/html")
              ;;
          esac

          if [[ "${{ matrix.runtime }}" == "jvm" ]]; then
            ARTIFACT="${{ steps.artifact_jvm.outputs.artifact }}"

            (
              cd "${{ matrix.framework }}"
              java -jar "$ARTIFACT"
            ) > /tmp/framework.log 2>&1 &
          else
            case "${{ matrix.framework }}" in
              Quarkus)
                ARTIFACT="${{ steps.artifact_quarkus.outputs.artifact }}"
                ;;
              Ktor)
                ARTIFACT="${{ steps.artifact_ktor.outputs.artifact }}"
                ;;
              Http4k)
                ARTIFACT="${{ steps.http4k_native.outputs.artifact }}"
                ;;
              *)
                echo "::error::Unsupported native framework"
                exit 1
                ;;
            esac

            chmod +x "$ARTIFACT"

            "$ARTIFACT" > /tmp/framework.log 2>&1 &
          fi

          PID=$!
          READY=0
          LAST_STATUS="none"

          for SECOND in $(seq 1 "$STARTUP_TIMEOUT"); do
            LAST_STATUS=$(curl \
              "${CURL_HEADERS[@]}" \
              --silent \
              --output /dev/null \
              --write-out '%{http_code}' \
              --max-time 1 \
              "http://127.0.0.1:${PORT}/greet/John" || true)

            if [[ "$LAST_STATUS" == "200" ]]; then
              READY=1
              break
            fi

            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi

            sleep 1
          done

          if [[ "$READY" != "1" ]]; then
            echo "::error::Application did not become ready"
            echo "::error::Last HTTP status: ${LAST_STATUS}"
            cat /tmp/framework.log || true
            kill "$PID" 2>/dev/null || true
            exit 1
          fi

          # Warm up the application before measuring HTTP latency.
          for i in {1..20}; do
            curl \
              "${CURL_HEADERS[@]}" \
              --silent \
              --fail \
              --output /dev/null \
              "http://127.0.0.1:${PORT}/greet/John"
          done

          # curl returns time_total in seconds. Values are converted to
          # milliseconds when calculating average, median and P95.
          VALUES=""

          for i in $(seq 1 100); do
            TIME_SECONDS=$(curl \
              "${CURL_HEADERS[@]}" \
              --silent \
              --fail \
              --output /dev/null \
              --write-out '%{time_total}' \
              "http://127.0.0.1:${PORT}/greet/John")

            VALUES="${VALUES}${TIME_SECONDS}"$'\n'
          done

          AVG_MS=$(echo "$VALUES" | awk '
            NF {
              sum += $1
              count++
            }
            END {
              if (count > 0)
                printf "%.3f", (sum/count) * 1000
              else
                printf "0.000"
            }
          ')

          MEDIAN_MS=$(echo "$VALUES" | sort -n | awk '
            NF { a[++n]=$1 }
            END {
              if (n == 0)
                printf "0.000"
              else if (n % 2)
                printf "%.3f", a[(n+1)/2] * 1000
              else
                printf "%.3f", ((a[n/2]+a[n/2+1])/2) * 1000
            }
          ')

          P95_MS=$(echo "$VALUES" | sort -n | awk '
            NF { a[++n]=$1 }
            END {
              if (n == 0) {
                printf "0.000"
              } else {
                i=int(n*0.95+0.999)
                if (i<1) i=1
                printf "%.3f", a[i] * 1000
              }
            }
          ')

          echo "HTTP average: ${AVG_MS} ms"
          echo "HTTP median:  ${MEDIAN_MS} ms"
          echo "HTTP P95:     ${P95_MS} ms"

          echo "avg_ms=${AVG_MS}" >> "$GITHUB_OUTPUT"
          echo "median_ms=${MEDIAN_MS}" >> "$GITHUB_OUTPUT"
          echo "p95_ms=${P95_MS}" >> "$GITHUB_OUTPUT"

          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          fuser -k "${PORT}/tcp" 2>/dev/null || true

      # -----------------------------------------------------------------------
      # CREATE RESULT JSON
      # -----------------------------------------------------------------------

      - name: Create result JSON
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p results

          FRAMEWORK="${{ matrix.framework }}"
          RUNTIME="${{ matrix.runtime }}"

          if [[ "$RUNTIME" == "jvm" ]]; then
            BUILD="${{ steps.build_jvm.outputs.build_ms || 0 }}"
            ARTIFACT="${{ steps.artifact_jvm.outputs.size_mb || 0 }}"
            STARTUP="${{ steps.benchmark_jvm.outputs.startup_median_ms || 0 }}"
            STARTUP_P95="${{ steps.benchmark_jvm.outputs.startup_p95_ms || 0 }}"
            MEMORY="${{ steps.benchmark_jvm.outputs.memory_median_mb || 0 }}"
          else
            BUILD="${{ steps.build_native.outputs.build_ms || 0 }}"
            STARTUP="${{ steps.benchmark_native.outputs.startup_median_ms || 0 }}"
            STARTUP_P95="${{ steps.benchmark_native.outputs.startup_p95_ms || 0 }}"
            MEMORY="${{ steps.benchmark_native.outputs.memory_median_mb || 0 }}"

            case "$FRAMEWORK" in
              Quarkus)
                ARTIFACT="${{ steps.artifact_quarkus.outputs.size_mb || 0 }}"
                ;;
              Ktor)
                ARTIFACT="${{ steps.artifact_ktor.outputs.size_mb || 0 }}"
                ;;
              Http4k)
                ARTIFACT="${{ steps.http4k_native.outputs.size_mb || 0 }}"
                ;;
              *)
                ARTIFACT="0"
                ;;
            esac
          fi

          HTTP_AVG="${{ steps.http.outputs.avg_ms || 0 }}"
          HTTP_MEDIAN="${{ steps.http.outputs.median_ms || 0 }}"
          HTTP_P95="${{ steps.http.outputs.p95_ms || 0 }}"

          cat > "results/${FRAMEWORK}-${RUNTIME}.json" <<EOF
          {
            "framework": "$FRAMEWORK",
            "runtime": "$RUNTIME",
            "commit": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "runner": "${RUNNER_OS}",
            "java_version": "${JAVA_VERSION}",
            "measurements": ${RUNS},
            "build_time_ms": ${BUILD},
            "artifact_size_mb": ${ARTIFACT},
            "startup_median_ms": ${STARTUP},
            "startup_p95_ms": ${STARTUP_P95},
            "memory_median_mb": ${MEMORY},
            "http_average_ms": ${HTTP_AVG},
            "http_median_ms": ${HTTP_MEDIAN},
            "http_p95_ms": ${HTTP_P95}
          }
          EOF

          cat "results/${FRAMEWORK}-${RUNTIME}.json"

      # -----------------------------------------------------------------------
      # UPLOAD INDIVIDUAL RESULT
      # -----------------------------------------------------------------------

      - name: Upload individual result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.framework }}-${{ matrix.runtime }}
          path: results/
          retention-days: 30
          if-no-files-found: error

  # ===========================================================================
  # REPORT
  # ===========================================================================

  report:
    name: Generate benchmark report
    runs-on: ubuntu-latest
    needs: benchmark
    if: always()

    steps:
      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: downloaded
          merge-multiple: true

      - name: Generate combined report
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports

          jq -s '.' downloaded/*.json > reports/results.json

          cat > reports/results.md <<EOF
          # Web Framework Benchmark

          **Run:** ${GITHUB_RUN_NUMBER}

          **Commit:** \`${GITHUB_SHA}\`

          **Measurements per runtime:** ${RUNS}

          ## Results

          | Framework | Runtime | Build | Artifact | Startup median | Startup P95 | Memory median | HTTP avg | HTTP P95 |
          |---|---|---:|---:|---:|---:|---:|---:|---:|
          EOF

          jq -r '
            sort_by(.framework, .runtime)[] |
            "| \(.framework) | \(.runtime) | \(.build_time_ms) ms | \(.artifact_size_mb) MB | \(.startup_median_ms) ms | \(.startup_p95_ms) ms | \(.memory_median_mb) MB | \(.http_average_ms) ms | \(.http_p95_ms) ms |"
          ' reports/results.json >> reports/results.md

          cat reports/results.md

      - name: Add report to GitHub Summary
        shell: bash
        run: |
          cat reports/results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            reports/results.md
            reports/results.json
          retention-days: 90
          if-no-files-found: error
