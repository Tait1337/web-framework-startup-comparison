name: Web Framework Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRAALVM_VERSION: "17"
  PORT: "8080"
  RUNS: "7"
  STARTUP_TIMEOUT: "120"
  SPRING_NATIVE_IMAGE: "benchmark-spring-native:${{ github.run_id }}-${{ github.run_attempt }}"

  # Use a clean Gradle home for every matrix job. Nothing is restored from
  # previous workflow runs.
  GRADLE_USER_HOME: "${{ runner.temp }}/gradle-user-home"

jobs:
  benchmark:
    name: ${{ matrix.framework }} / ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        framework:
          - Spring
          - Quarkus
          - Ktor
          - Http4k
        runtime:
          - jvm
          - native

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set selected Gradle wrapper executable
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "${{ matrix.framework }}/gradlew"

      # Do not configure the setup-java Gradle cache. GRADLE_USER_HOME points
      # to a fresh runner temporary directory, and every Gradle invocation also
      # explicitly disables the Gradle build cache.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Spring gets GraalVM from the Cloud Native Buildpacks builder.
      # Quarkus uses its own compatible native-image builder container.
      - name: Setup GraalVM
        if: >-
          matrix.runtime == 'native' &&
          matrix.framework != 'Quarkus' &&
          matrix.framework != 'Spring'
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ env.GRAALVM_VERSION }}
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Framework:         ${{ matrix.framework }}"
          echo "Runtime:           ${{ matrix.runtime }}"
          echo "Runner OS:         ${RUNNER_OS}"
          echo "Runner arch:       ${RUNNER_ARCH}"
          echo "Runner image OS:   ${ImageOS:-unknown}"
          echo "Runner image ver.: ${ImageVersion:-unknown}"
          echo "Gradle user home:  ${GRADLE_USER_HOME}"

          echo
          echo "Java:"
          java -version

          echo
          echo "Native Image:"
          native-image --version 2>/dev/null || true

          echo
          echo "Docker:"
          docker --version 2>/dev/null || true

          echo
          echo "Operating system:"
          cat /etc/os-release || true

          echo
          echo "CPU:"
          lscpu || true

          echo
          echo "CPU count:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h /

      # -----------------------------------------------------------------------
      # JVM BUILD
      # -----------------------------------------------------------------------

      - name: Build JVM
        if: matrix.runtime == 'jvm'
        id: build_jvm
        working-directory: ${{ matrix.framework }}
        shell: bash
        run: |
          set -euo pipefail

          # --no-build-cache prevents Gradle build-cache reads and writes.
          # --rerun-tasks prevents task output reuse.
          GRADLE_FLAGS=(
            --no-daemon
            --no-build-cache
            --rerun-tasks
          )

          START=$(date +%s%N)

          case "${{ matrix.framework }}" in
            Ktor|Http4k)
              ./gradlew clean build shadowJar "${GRADLE_FLAGS[@]}"
              ;;

            Spring|Quarkus)
              ./gradlew clean build "${GRADLE_FLAGS[@]}"
              ;;

            *)
              echo "::error::Unsupported JVM framework: ${{ matrix.framework }}"
              exit 1
              ;;
          esac

          END=$(date +%s%N)
          BUILD_MS=$(( (END - START) / 1000000 ))

          echo "Build time: ${BUILD_MS} ms"
          echo "build_ms=${BUILD_MS}" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # FIND JVM ARTIFACT
      # -----------------------------------------------------------------------

      - name: Find JVM artifact
        if: matrix.runtime == 'jvm'
        id: artifact_jvm
        working-directory: ${{ matrix.framework }}
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.framework }}" in
            Spring)
              # Use the regular executable Spring Boot JAR. The *-aot.jar file
              # is an intermediate native-build artifact.
              ARTIFACT=$(find build/libs \
                -maxdepth 1 \
                -type f \
                -name "*.jar" \
                ! -name "*-aot.jar" \
                ! -name "*-plain.jar" \
                ! -name "*-sources.jar" \
                ! -name "*-javadoc.jar" \
                -print \
                -quit)

              if [[ -z "${ARTIFACT:-}" || ! -f "$ARTIFACT" ]]; then
                echo "::error::Could not find the Spring Boot JVM artifact"
                find build/libs \
                  -maxdepth 1 \
                  -type f \
                  -printf '%s %p\n' |
                  sort || true
                exit 1
              fi

              MANIFEST=$(unzip -p "$ARTIFACT" META-INF/MANIFEST.MF)

              if ! grep -qE \
                '^Main-Class: org\.springframework\.boot\.loader\.' \
                <<< "$MANIFEST"; then
                echo "::error::Spring JVM artifact is not an executable Boot JAR"
                echo "::error::Artifact: $ARTIFACT"
                echo "$MANIFEST"
                exit 1
              fi

              if ! grep -q '^Start-Class:' <<< "$MANIFEST"; then
                echo "::error::Spring JVM artifact has no Start-Class"
                echo "::error::Artifact: $ARTIFACT"
                echo "$MANIFEST"
                exit 1
              fi

              SIZE_BYTES=$(stat -c%s "$ARTIFACT")
              SIZE_DESCRIPTION="$ARTIFACT (executable Spring Boot JAR)"
              ;;

            Quarkus)
              APP_DIR="build/quarkus-app"
              ARTIFACT="${APP_DIR}/quarkus-run.jar"

              if [[ ! -f "$ARTIFACT" ]]; then
                echo "::error::Could not find Quarkus JVM launcher: $ARTIFACT"
                find build -type f | sort || true
                exit 1
              fi

              SIZE_BYTES=$(find "$APP_DIR" \
                -type f \
                -printf '%s\n' |
                awk '{ total += $1 } END { printf "%.0f", total }')

              SIZE_DESCRIPTION="$APP_DIR (complete Quarkus distribution)"
              ;;

            Ktor|Http4k)
              ARTIFACT=$(find build/libs \
                -maxdepth 1 \
                -type f \
                -name "*-all.jar" \
                -print \
                -quit)

              if [[ -z "${ARTIFACT:-}" || ! -f "$ARTIFACT" ]]; then
                echo "::error::Could not find executable ${{ matrix.framework }} fat JAR"
                find build/libs \
                  -maxdepth 1 \
                  -type f \
                  -printf '%p\n' |
                  sort || true
                exit 1
              fi

              if ! unzip -p "$ARTIFACT" META-INF/MANIFEST.MF |
                grep -qi '^Main-Class:'; then
                echo "::error::The fat JAR has no Main-Class manifest entry"
                unzip -p "$ARTIFACT" META-INF/MANIFEST.MF || true
                exit 1
              fi

              SIZE_BYTES=$(stat -c%s "$ARTIFACT")
              SIZE_DESCRIPTION="$ARTIFACT (executable fat JAR)"
              ;;

            *)
              echo "::error::Unsupported JVM framework: ${{ matrix.framework }}"
              exit 1
              ;;
          esac

          if [[ -z "${SIZE_BYTES:-}" || "$SIZE_BYTES" -le 0 ]]; then
            echo "::error::Could not determine JVM artifact size"
            exit 1
          fi

          SIZE_MB=$(awk -v bytes="$SIZE_BYTES" \
            'BEGIN { printf "%.2f", bytes / 1024 / 1024 }')

          echo "Launcher:          $ARTIFACT"
          echo "Measured artifact: $SIZE_DESCRIPTION"
          echo "Size:              ${SIZE_BYTES} bytes (${SIZE_MB} MB)"

          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # NATIVE BUILD
      #
      # This step includes the complete native build for every framework.
      # In particular, Http4k agent configuration and native-image compilation
      # are included in the measured build time.
      # -----------------------------------------------------------------------

      - name: Build Native
        if: matrix.runtime == 'native'
        id: build_native
        working-directory: ${{ matrix.framework }}
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FLAGS=(
            --no-daemon
            --no-build-cache
            --rerun-tasks
          )

          START=$(date +%s%N)

          case "${{ matrix.framework }}" in
            Spring)
              echo "========================================"
              echo "Building Spring native container image"
              echo "Image: $SPRING_NATIVE_IMAGE"
              echo "========================================"

              ./gradlew clean bootBuildImage \
                --imageName="$SPRING_NATIVE_IMAGE" \
                "${GRADLE_FLAGS[@]}"

              if ! docker image inspect "$SPRING_NATIVE_IMAGE" \
                >/dev/null 2>&1; then
                echo "::error::Spring native container image was not created"
                echo "::error::Expected image: $SPRING_NATIVE_IMAGE"
                docker image ls
                exit 1
              fi

              # Extract the application filesystem from the Buildpacks image.
              # The resulting native executable is run directly during the
              # benchmark, rather than measuring Docker startup.
              ROOTFS="$RUNNER_TEMP/spring-native-rootfs"
              CONTAINER_NAME="spring-native-extract-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

              rm -rf "$ROOTFS"
              mkdir -p "$ROOTFS"
              docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

              docker create \
                --name "$CONTAINER_NAME" \
                "$SPRING_NATIVE_IMAGE" \
                >/dev/null

              cleanup_spring_image() {
                docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
                docker image rm -f "$SPRING_NATIVE_IMAGE" >/dev/null 2>&1 || true
              }

              trap cleanup_spring_image EXIT

              docker export "$CONTAINER_NAME" |
                tar -xf - -C "$ROOTFS"

              echo
              echo "Executable candidates in /workspace:"

              find "$ROOTFS/workspace" \
                -type f \
                -perm /111 \
                -printf '%s %p\n' |
                sort -nr || true

              # Native Buildpacks place the application under /workspace.
              # Select the largest executable ELF file that is not a shared
              # library. The application executable is normally the largest
              # executable in that directory.
              SPRING_EXECUTABLE=""

              while IFS= read -r CANDIDATE; do
                if [[ -z "$CANDIDATE" ]]; then
                  continue
                fi

                DESCRIPTION=$(file -b "$CANDIDATE" || true)
                BASENAME=$(basename "$CANDIDATE")

                echo "Candidate: $CANDIDATE"
                echo "Type:      $DESCRIPTION"

                if [[ "$BASENAME" == *.so || "$BASENAME" == *.so.* ]]; then
                  continue
                fi

                if grep -qE 'ELF .*(executable|shared object)' \
                  <<< "$DESCRIPTION"; then
                  SPRING_EXECUTABLE="$CANDIDATE"
                  break
                fi
              done < <(
                find "$ROOTFS/workspace" \
                  -type f \
                  -perm /111 \
                  -printf '%s\t%p\n' |
                  sort -nr |
                  cut -f2-
              )

              if [[ -z "$SPRING_EXECUTABLE" ||
                    ! -s "$SPRING_EXECUTABLE" ]]; then
                echo "::error::Could not locate the Spring native executable"
                find "$ROOTFS/workspace" \
                  -maxdepth 4 \
                  -type f \
                  -exec file {} \; || true
                exit 1
              fi

              ARTIFACT="$PWD/app"
              rm -f "$ARTIFACT"
              cp "$SPRING_EXECUTABLE" "$ARTIFACT"
              chmod +x "$ARTIFACT"

              echo
              echo "Extracted Spring native executable:"
              echo "Source:   $SPRING_EXECUTABLE"
              echo "Artifact: $ARTIFACT"
              file "$ARTIFACT" || true
              ldd "$ARTIFACT" || true

              cleanup_spring_image
              trap - EXIT
              ;;

            Quarkus)
              echo "========================================"
              echo "Building Quarkus native executable"
              echo "========================================"

              ./gradlew clean build \
                -Dquarkus.package.type=native \
                -Dquarkus.native.container-build=true \
                -Dquarkus.native.additional-build-args=-J-XX:-UseContainerSupport \
                "${GRADLE_FLAGS[@]}"

              ARTIFACT=$(find build \
                -type f \
                \( -name "*-runner" -o -name "app" \) \
                ! -name "*.jar" \
                -print \
                -quit)

              if [[ -z "${ARTIFACT:-}" || ! -f "$ARTIFACT" ]]; then
                echo "::error::Could not find Quarkus native executable"
                find build -type f -printf '%M %p\n' | sort || true
                exit 1
              fi

              ARTIFACT=$(realpath "$ARTIFACT")
              chmod +x "$ARTIFACT"
              ;;

            Ktor)
              echo "========================================"
              echo "Building Ktor executable fat JAR"
              echo "========================================"

              ./gradlew clean shadowJar "${GRADLE_FLAGS[@]}"

              JAR=$(find build/libs \
                -maxdepth 1 \
                -type f \
                -name "*-all.jar" \
                -print \
                -quit)

              if [[ -z "${JAR:-}" || ! -f "$JAR" ]]; then
                echo "::error::Could not find Ktor executable fat JAR"
                find build/libs \
                  -maxdepth 1 \
                  -type f \
                  -printf '%p\n' |
                  sort || true
                exit 1
              fi

              if ! unzip -p "$JAR" META-INF/MANIFEST.MF |
                grep -qi '^Main-Class:'; then
                echo "::error::Ktor fat JAR has no Main-Class"
                unzip -p "$JAR" META-INF/MANIFEST.MF || true
                exit 1
              fi

              if [[ ! -f "graal-reflection-configuration.json" ]]; then
                echo "::error::Missing Ktor GraalVM reflection configuration"
                exit 1
              fi

              echo
              echo "========================================"
              echo "Building Ktor native executable"
              echo "========================================"

              native-image --version
              rm -f app

              native-image \
                --no-fallback \
                --static \
                --enable-url-protocols=http \
                -H:+ReportExceptionStackTraces \
                -H:IncludeResources="(.*.properties)|(static/.*)|(META-INF/.*)" \
                -H:ReflectionConfigurationFiles=graal-reflection-configuration.json \
                --allow-incomplete-classpath \
                --initialize-at-build-time=io.ktor,kotlinx,kotlin \
                -jar "$JAR" \
                app

              ARTIFACT="$PWD/app"

              if [[ ! -s "$ARTIFACT" ]]; then
                echo "::error::Ktor native executable was not created"
                find . -maxdepth 2 -type f -printf '%p\n' | sort || true
                exit 1
              fi

              chmod +x "$ARTIFACT"
              ;;

            Http4k)
              echo "========================================"
              echo "Building Http4k executable fat JAR"
              echo "========================================"

              ./gradlew clean shadowJar "${GRADLE_FLAGS[@]}"

              JAR=$(find build/libs \
                -maxdepth 1 \
                -type f \
                -name "*-all.jar" \
                -print \
                -quit)

              if [[ -z "${JAR:-}" || ! -f "$JAR" ]]; then
                echo "::error::Could not find Http4k executable fat JAR"

                if [[ -d build/libs ]]; then
                  find build/libs \
                    -maxdepth 1 \
                    -type f \
                    -printf '%M %s %p\n' |
                    sort || true
                fi

                exit 1
              fi

              if ! unzip -p "$JAR" META-INF/MANIFEST.MF |
                grep -qi '^Main-Class:'; then
                echo "::error::Http4k fat JAR has no Main-Class"
                unzip -p "$JAR" META-INF/MANIFEST.MF || true
                exit 1
              fi

              CONFIG_DIR="$PWD/build/native-image-config"
              AGENT_LOG="$PWD/build/native-image-agent.log"

              rm -rf "$CONFIG_DIR"
              mkdir -p "$CONFIG_DIR"
              rm -f "$AGENT_LOG"

              echo
              echo "Generating Http4k native-image configuration..."

              java \
                -agentlib:native-image-agent=config-output-dir="$CONFIG_DIR" \
                -jar "$JAR" \
                > "$AGENT_LOG" 2>&1 &

              AGENT_PID=$!

              cleanup_agent() {
                if kill -0 "$AGENT_PID" 2>/dev/null; then
                  kill -TERM "$AGENT_PID" 2>/dev/null || true

                  for _ in $(seq 1 15); do
                    if ! kill -0 "$AGENT_PID" 2>/dev/null; then
                      break
                    fi
                    sleep 1
                  done

                  if kill -0 "$AGENT_PID" 2>/dev/null; then
                    kill -KILL "$AGENT_PID" 2>/dev/null || true
                  fi
                fi

                wait "$AGENT_PID" 2>/dev/null || true
                fuser -k "${PORT}/tcp" 2>/dev/null || true
              }

              trap cleanup_agent EXIT

              READY=0
              LAST_STATUS="none"
              READY_START=$(date +%s%N)
              DEADLINE=$(( READY_START + STARTUP_TIMEOUT * 1000000000 ))

              while true; do
                LAST_STATUS=$(curl \
                  --silent \
                  --output /dev/null \
                  --write-out '%{http_code}' \
                  --connect-timeout 0.05 \
                  --max-time 0.2 \
                  "http://127.0.0.1:${PORT}/greet/John" || true)

                if [[ "$LAST_STATUS" == "200" ]]; then
                  READY=1
                  break
                fi

                if ! kill -0 "$AGENT_PID" 2>/dev/null; then
                  break
                fi

                NOW=$(date +%s%N)

                if (( NOW >= DEADLINE )); then
                  break
                fi

                sleep 0.005
              done

              if [[ "$READY" != "1" ]]; then
                echo "::error::Http4k did not become ready while generating native-image configuration"
                echo "::error::Last HTTP status: ${LAST_STATUS}"
                cat "$AGENT_LOG" || true
                exit 1
              fi

              # Exercise serialization, reflection and the response DTO.
              for i in $(seq 1 20); do
                RESPONSE=$(curl \
                  --silent \
                  --show-error \
                  --fail \
                  "http://127.0.0.1:${PORT}/greet/John")

                echo "Agent request ${i}: ${RESPONSE}"
              done

              cleanup_agent
              trap - EXIT

              echo
              echo "Generated native-image configuration:"

              find "$CONFIG_DIR" \
                -maxdepth 1 \
                -type f \
                -printf '%M %s %p\n' |
                sort || true

              if [[ ! -f "$CONFIG_DIR/reflect-config.json" ]]; then
                echo "::error::The native-image agent did not generate reflect-config.json"
                cat "$AGENT_LOG" || true
                exit 1
              fi

              echo
              echo "========================================"
              echo "Building Http4k native executable"
              echo "========================================"

              ARTIFACT="$PWD/app"
              rm -f "$ARTIFACT"

              native-image \
                --no-fallback \
                --enable-url-protocols=http \
                -H:+ReportExceptionStackTraces \
                -H:ConfigurationFileDirectories="$CONFIG_DIR" \
                -jar "$JAR" \
                app

              if [[ ! -s "$ARTIFACT" ]]; then
                echo "::error::Http4k native executable was not created"
                find "$PWD" \
                  -maxdepth 2 \
                  -type f \
                  -printf '%M %s %p\n' |
                  sort || true
                exit 1
              fi

              chmod +x "$ARTIFACT"
              ;;

            *)
              echo "::error::Unsupported native framework: ${{ matrix.framework }}"
              exit 1
              ;;
          esac

          if [[ ! -s "$ARTIFACT" ]]; then
            echo "::error::Native artifact does not exist or is empty"
            echo "::error::Expected artifact: $ARTIFACT"
            exit 1
          fi

          if [[ ! -x "$ARTIFACT" ]]; then
            echo "::error::Native artifact is not executable"
            ls -l "$ARTIFACT" || true
            exit 1
          fi

          END=$(date +%s%N)
          BUILD_MS=$(( (END - START) / 1000000 ))

          SIZE_BYTES=$(stat -c%s "$ARTIFACT")
          SIZE_MB=$(awk -v bytes="$SIZE_BYTES" \
            'BEGIN { printf "%.2f", bytes / 1024 / 1024 }')

          echo
          echo "Native executable:"
          echo "  Artifact:   $ARTIFACT"
          echo "  Size:       ${SIZE_BYTES} bytes (${SIZE_MB} MB)"
          echo "  Build time: ${BUILD_MS} ms"

          file "$ARTIFACT" || true

          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"
          echo "build_ms=$BUILD_MS" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # JVM STARTUP AND MEMORY BENCHMARK
      # -----------------------------------------------------------------------

      - name: Benchmark JVM
        if: matrix.runtime == 'jvm'
        id: benchmark_jvm
        shell: bash
        run: |
          set -euo pipefail

          FRAMEWORK_DIR="${{ matrix.framework }}"
          ARTIFACT_RELATIVE="${{ steps.artifact_jvm.outputs.artifact }}"
          ARTIFACT=$(realpath "${FRAMEWORK_DIR}/${ARTIFACT_RELATIVE}")

          CURL_HEADERS=()

          case "${{ matrix.framework }}" in
            Spring)
              CURL_HEADERS=(-H "Accept: text/html")
              ;;
            Quarkus)
              CURL_HEADERS=(-H "Content-Type: text/html")
              ;;
          esac

          STARTUP_FILE="$RUNNER_TEMP/startup-values.txt"
          MEMORY_FILE="$RUNNER_TEMP/memory-values.txt"

          : > "$STARTUP_FILE"
          : > "$MEMORY_FILE"

          PID=""

          cleanup() {
            if [[ -n "${PID:-}" ]] && kill -0 "$PID" 2>/dev/null; then
              kill -TERM "$PID" 2>/dev/null || true

              for _ in $(seq 1 20); do
                if ! kill -0 "$PID" 2>/dev/null; then
                  break
                fi
                sleep 0.05
              done

              if kill -0 "$PID" 2>/dev/null; then
                kill -KILL "$PID" 2>/dev/null || true
              fi
            fi

            if [[ -n "${PID:-}" ]]; then
              wait "$PID" 2>/dev/null || true
            fi

            fuser -k "${PORT}/tcp" 2>/dev/null || true
            PID=""
          }

          trap cleanup EXIT

          for RUN in $(seq 1 "$RUNS"); do
            echo
            echo "JVM run ${RUN} / ${RUNS}"

            rm -f /tmp/framework.log

            START=$(date +%s%N)

            (
              cd "$FRAMEWORK_DIR"
              exec java -jar "$ARTIFACT"
            ) > /tmp/framework.log 2>&1 &

            PID=$!
            READY=0
            LAST_STATUS="none"
            DEADLINE=$(( START + STARTUP_TIMEOUT * 1000000000 ))

            while true; do
              LAST_STATUS=$(curl \
                "${CURL_HEADERS[@]}" \
                --silent \
                --output /dev/null \
                --write-out '%{http_code}' \
                --connect-timeout 0.05 \
                --max-time 0.2 \
                "http://127.0.0.1:${PORT}/greet/John" || true)

              if [[ "$LAST_STATUS" == "200" ]]; then
                END=$(date +%s%N)
                STARTUP_MS=$(( (END - START) / 1000000 ))
                READY=1
                break
              fi

              if ! kill -0 "$PID" 2>/dev/null; then
                break
              fi

              NOW=$(date +%s%N)

              if (( NOW >= DEADLINE )); then
                break
              fi

              sleep 0.005
            done

            if [[ "$READY" != "1" ]]; then
              echo "::error::JVM application did not become ready"
              echo "::error::Last HTTP status: ${LAST_STATUS}"
              cat /tmp/framework.log || true
              exit 1
            fi

            sleep 2

            RSS_KB=$(ps -o rss= -p "$PID" | tr -d ' ')

            if [[ -z "$RSS_KB" ]]; then
              echo "::error::Could not read JVM RSS"
              exit 1
            fi

            RSS_MB=$(awk -v rss="$RSS_KB" \
              'BEGIN { printf "%.2f", rss / 1024 }')

            echo "Startup: ${STARTUP_MS} ms"
            echo "Memory:  ${RSS_MB} MB"

            echo "$STARTUP_MS" >> "$STARTUP_FILE"
            echo "$RSS_MB" >> "$MEMORY_FILE"

            cleanup
            sleep 1
          done

          MEDIAN_STARTUP=$(sort -n "$STARTUP_FILE" | awk '
            NF { a[++n]=$1 }
            END {
              if (n % 2)
                print a[(n+1)/2]
              else
                printf "%.1f", (a[n/2]+a[n/2+1])/2
            }
          ')

          P95_STARTUP=$(sort -n "$STARTUP_FILE" | awk '
            NF { a[++n]=$1 }
            END {
              i=int(n*0.95+0.999)
              if (i<1) i=1
              print a[i]
            }
          ')

          MEDIAN_MEMORY=$(sort -n "$MEMORY_FILE" | awk '
            NF { a[++n]=$1 }
            END {
              if (n % 2)
                printf "%.2f", a[(n+1)/2]
              else
                printf "%.2f", (a[n/2]+a[n/2+1])/2
            }
          ')

          echo "startup_median_ms=${MEDIAN_STARTUP}" >> "$GITHUB_OUTPUT"
          echo "startup_p95_ms=${P95_STARTUP}" >> "$GITHUB_OUTPUT"
          echo "memory_median_mb=${MEDIAN_MEMORY}" >> "$GITHUB_OUTPUT"

          trap - EXIT

      # -----------------------------------------------------------------------
      # NATIVE STARTUP AND MEMORY BENCHMARK
      #
      # All frameworks, including Spring, run as direct host executables.
      # -----------------------------------------------------------------------

      - name: Benchmark Native
        if: matrix.runtime == 'native'
        id: benchmark_native
        working-directory: ${{ matrix.framework }}
        shell: bash
        run: |
          set -euo pipefail

          ARTIFACT="${{ steps.build_native.outputs.artifact }}"
          CURL_HEADERS=()

          case "${{ matrix.framework }}" in
            Spring)
              CURL_HEADERS=(-H "Accept: text/html")
              ;;
            Quarkus)
              CURL_HEADERS=(-H "Content-Type: text/html")
              ;;
          esac

          if [[ ! -s "$ARTIFACT" ]]; then
            echo "::error::Native executable does not exist: $ARTIFACT"
            exit 1
          fi

          chmod +x "$ARTIFACT"

          STARTUP_FILE="$RUNNER_TEMP/startup-values.txt"
          MEMORY_FILE="$RUNNER_TEMP/memory-values.txt"

          : > "$STARTUP_FILE"
          : > "$MEMORY_FILE"

          PID=""

          cleanup() {
            if [[ -n "${PID:-}" ]] && kill -0 "$PID" 2>/dev/null; then
              kill -TERM "$PID" 2>/dev/null || true

              for _ in $(seq 1 20); do
                if ! kill -0 "$PID" 2>/dev/null; then
                  break
                fi
                sleep 0.05
              done

              if kill -0 "$PID" 2>/dev/null; then
                kill -KILL "$PID" 2>/dev/null || true
              fi
            fi

            if [[ -n "${PID:-}" ]]; then
              wait "$PID" 2>/dev/null || true
            fi

            fuser -k "${PORT}/tcp" 2>/dev/null || true
            PID=""
          }

          trap cleanup EXIT

          for RUN in $(seq 1 "$RUNS"); do
            echo
            echo "Native run ${RUN} / ${RUNS}"

            rm -f /tmp/framework.log

            START=$(date +%s%N)

            SERVER_PORT="$PORT" "$ARTIFACT" \
              > /tmp/framework.log 2>&1 &

            PID=$!
            READY=0
            LAST_STATUS="none"
            DEADLINE=$(( START + STARTUP_TIMEOUT * 1000000000 ))

            while true; do
              LAST_STATUS=$(curl \
                "${CURL_HEADERS[@]}" \
                --silent \
                --output /dev/null \
                --write-out '%{http_code}' \
                --connect-timeout 0.05 \
                --max-time 0.2 \
                "http://127.0.0.1:${PORT}/greet/John" || true)

              if [[ "$LAST_STATUS" == "200" ]]; then
                END=$(date +%s%N)
                STARTUP_MS=$(( (END - START) / 1000000 ))
                READY=1
                break
              fi

              if ! kill -0 "$PID" 2>/dev/null; then
                break
              fi

              NOW=$(date +%s%N)

              if (( NOW >= DEADLINE )); then
                break
              fi

              sleep 0.005
            done

            if [[ "$READY" != "1" ]]; then
              echo "::error::Native application did not become ready"
              echo "::error::Last HTTP status: ${LAST_STATUS}"
              cat /tmp/framework.log || true
              exit 1
            fi

            sleep 2

            RSS_KB=$(ps -o rss= -p "$PID" | tr -d ' ')

            if [[ -z "$RSS_KB" ]]; then
              echo "::error::Could not read native RSS"
              exit 1
            fi

            RSS_MB=$(awk -v rss="$RSS_KB" \
              'BEGIN { printf "%.2f", rss / 1024 }')

            echo "Startup: ${STARTUP_MS} ms"
            echo "Memory:  ${RSS_MB} MB"

            echo "$STARTUP_MS" >> "$STARTUP_FILE"
            echo "$RSS_MB" >> "$MEMORY_FILE"

            cleanup
            sleep 1
          done

          MEDIAN_STARTUP=$(sort -n "$STARTUP_FILE" | awk '
            NF { a[++n]=$1 }
            END {
              if (n % 2)
                print a[(n+1)/2]
              else
                printf "%.1f", (a[n/2]+a[n/2+1])/2
            }
          ')

          P95_STARTUP=$(sort -n "$STARTUP_FILE" | awk '
            NF { a[++n]=$1 }
            END {
              i=int(n*0.95+0.999)
              if (i<1) i=1
              print a[i]
            }
          ')

          MEDIAN_MEMORY=$(sort -n "$MEMORY_FILE" | awk '
            NF { a[++n]=$1 }
            END {
              if (n % 2)
                printf "%.2f", a[(n+1)/2]
              else
                printf "%.2f", (a[n/2]+a[n/2+1])/2
            }
          ')

          echo "startup_median_ms=${MEDIAN_STARTUP}" >> "$GITHUB_OUTPUT"
          echo "startup_p95_ms=${P95_STARTUP}" >> "$GITHUB_OUTPUT"
          echo "memory_median_mb=${MEDIAN_MEMORY}" >> "$GITHUB_OUTPUT"

          trap - EXIT

      # -----------------------------------------------------------------------
      # HTTP LATENCY BENCHMARK
      # -----------------------------------------------------------------------

      - name: HTTP latency benchmark
        id: http
        shell: bash
        run: |
          set -euo pipefail

          CURL_HEADERS=()

          case "${{ matrix.framework }}" in
            Spring)
              CURL_HEADERS=(-H "Accept: text/html")
              ;;
            Quarkus)
              CURL_HEADERS=(-H "Content-Type: text/html")
              ;;
          esac

          rm -f /tmp/framework.log

          if [[ "${{ matrix.runtime }}" == "jvm" ]]; then
            FRAMEWORK_DIR="${{ matrix.framework }}"
            ARTIFACT_RELATIVE="${{ steps.artifact_jvm.outputs.artifact }}"
            ARTIFACT=$(realpath "${FRAMEWORK_DIR}/${ARTIFACT_RELATIVE}")

            (
              cd "$FRAMEWORK_DIR"
              exec java -jar "$ARTIFACT"
            ) > /tmp/framework.log 2>&1 &
          else
            ARTIFACT="${{ steps.build_native.outputs.artifact }}"
            chmod +x "$ARTIFACT"

            SERVER_PORT="$PORT" "$ARTIFACT" \
              > /tmp/framework.log 2>&1 &
          fi

          PID=$!

          cleanup() {
            if kill -0 "$PID" 2>/dev/null; then
              kill -TERM "$PID" 2>/dev/null || true

              for _ in $(seq 1 20); do
                if ! kill -0 "$PID" 2>/dev/null; then
                  break
                fi
                sleep 0.05
              done

              if kill -0 "$PID" 2>/dev/null; then
                kill -KILL "$PID" 2>/dev/null || true
              fi
            fi

            wait "$PID" 2>/dev/null || true
            fuser -k "${PORT}/tcp" 2>/dev/null || true
          }

          trap cleanup EXIT

          READY=0
          LAST_STATUS="none"
          START=$(date +%s%N)
          DEADLINE=$(( START + STARTUP_TIMEOUT * 1000000000 ))

          while true; do
            LAST_STATUS=$(curl \
              "${CURL_HEADERS[@]}" \
              --silent \
              --output /dev/null \
              --write-out '%{http_code}' \
              --connect-timeout 0.05 \
              --max-time 0.2 \
              "http://127.0.0.1:${PORT}/greet/John" || true)

            if [[ "$LAST_STATUS" == "200" ]]; then
              READY=1
              break
            fi

            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi

            NOW=$(date +%s%N)

            if (( NOW >= DEADLINE )); then
              break
            fi

            sleep 0.005
          done

          if [[ "$READY" != "1" ]]; then
            echo "::error::Application did not become ready"
            echo "::error::Last HTTP status: ${LAST_STATUS}"
            cat /tmp/framework.log || true
            exit 1
          fi

          # Warm-up requests.
          for _ in $(seq 1 20); do
            curl \
              "${CURL_HEADERS[@]}" \
              --silent \
              --fail \
              --output /dev/null \
              "http://127.0.0.1:${PORT}/greet/John"
          done

          VALUES_FILE="$RUNNER_TEMP/http-values.txt"
          : > "$VALUES_FILE"

          for _ in $(seq 1 100); do
            curl \
              "${CURL_HEADERS[@]}" \
              --silent \
              --fail \
              --output /dev/null \
              --write-out '%{time_total}\n' \
              "http://127.0.0.1:${PORT}/greet/John" \
              >> "$VALUES_FILE"
          done

          AVG_MS=$(awk '
            NF {
              sum += $1
              count++
            }
            END {
              if (count > 0)
                printf "%.3f", (sum/count) * 1000
              else
                exit 1
            }
          ' "$VALUES_FILE")

          MEDIAN_MS=$(sort -n "$VALUES_FILE" | awk '
            NF { a[++n]=$1 }
            END {
              if (n == 0)
                exit 1
              else if (n % 2)
                printf "%.3f", a[(n+1)/2] * 1000
              else
                printf "%.3f", ((a[n/2]+a[n/2+1])/2) * 1000
            }
          ')

          P95_MS=$(sort -n "$VALUES_FILE" | awk '
            NF { a[++n]=$1 }
            END {
              if (n == 0)
                exit 1

              i=int(n*0.95+0.999)
              if (i<1) i=1
              printf "%.3f", a[i] * 1000
            }
          ')

          echo "HTTP average: ${AVG_MS} ms"
          echo "HTTP median:  ${MEDIAN_MS} ms"
          echo "HTTP P95:     ${P95_MS} ms"

          echo "avg_ms=${AVG_MS}" >> "$GITHUB_OUTPUT"
          echo "median_ms=${MEDIAN_MS}" >> "$GITHUB_OUTPUT"
          echo "p95_ms=${P95_MS}" >> "$GITHUB_OUTPUT"

          cleanup
          trap - EXIT

      # -----------------------------------------------------------------------
      # CREATE RESULT JSON
      # -----------------------------------------------------------------------

      - name: Create result JSON
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p results

          FRAMEWORK="${{ matrix.framework }}"
          RUNTIME="${{ matrix.runtime }}"

          if [[ "$RUNTIME" == "jvm" ]]; then
            BUILD='${{ steps.build_jvm.outputs.build_ms || 'null' }}'
            ARTIFACT='${{ steps.artifact_jvm.outputs.size_mb || 'null' }}'
            STARTUP='${{ steps.benchmark_jvm.outputs.startup_median_ms || 'null' }}'
            STARTUP_P95='${{ steps.benchmark_jvm.outputs.startup_p95_ms || 'null' }}'
            MEMORY='${{ steps.benchmark_jvm.outputs.memory_median_mb || 'null' }}'
          else
            BUILD='${{ steps.build_native.outputs.build_ms || 'null' }}'
            ARTIFACT='${{ steps.build_native.outputs.size_mb || 'null' }}'
            STARTUP='${{ steps.benchmark_native.outputs.startup_median_ms || 'null' }}'
            STARTUP_P95='${{ steps.benchmark_native.outputs.startup_p95_ms || 'null' }}'
            MEMORY='${{ steps.benchmark_native.outputs.memory_median_mb || 'null' }}'
          fi

          HTTP_AVG='${{ steps.http.outputs.avg_ms || 'null' }}'
          HTTP_MEDIAN='${{ steps.http.outputs.median_ms || 'null' }}'
          HTTP_P95='${{ steps.http.outputs.p95_ms || 'null' }}'

          STATUS="success"

          for VALUE in \
            "$BUILD" \
            "$ARTIFACT" \
            "$STARTUP" \
            "$STARTUP_P95" \
            "$MEMORY" \
            "$HTTP_AVG" \
            "$HTTP_MEDIAN" \
            "$HTTP_P95"; do
            if [[ "$VALUE" == "null" || -z "$VALUE" ]]; then
              STATUS="failed"
              break
            fi
          done

          jq -n \
            --arg framework "$FRAMEWORK" \
            --arg runtime "$RUNTIME" \
            --arg status "$STATUS" \
            --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_number "$GITHUB_RUN_NUMBER" \
            --arg runner_os "$RUNNER_OS" \
            --arg runner_arch "$RUNNER_ARCH" \
            --arg image_os "${ImageOS:-unknown}" \
            --arg image_version "${ImageVersion:-unknown}" \
            --arg java_version "$JAVA_VERSION" \
            --argjson measurements "$RUNS" \
            --argjson build_time_ms "$BUILD" \
            --argjson artifact_size_mb "$ARTIFACT" \
            --argjson startup_median_ms "$STARTUP" \
            --argjson startup_p95_ms "$STARTUP_P95" \
            --argjson memory_median_mb "$MEMORY" \
            --argjson http_average_ms "$HTTP_AVG" \
            --argjson http_median_ms "$HTTP_MEDIAN" \
            --argjson http_p95_ms "$HTTP_P95" \
            '{
              framework: $framework,
              runtime: $runtime,
              status: $status,
              commit: $commit,
              run_id: $run_id,
              run_number: $run_number,
              runner: {
                os: $runner_os,
                architecture: $runner_arch,
                image_os: $image_os,
                image_version: $image_version
              },
              java_version: $java_version,
              measurements: $measurements,
              build_time_ms: $build_time_ms,
              artifact_size_mb: $artifact_size_mb,
              startup_median_ms: $startup_median_ms,
              startup_p95_ms: $startup_p95_ms,
              memory_median_mb: $memory_median_mb,
              http_average_ms: $http_average_ms,
              http_median_ms: $http_median_ms,
              http_p95_ms: $http_p95_ms
            }' \
            > "results/${FRAMEWORK}-${RUNTIME}.json"

          cat "results/${FRAMEWORK}-${RUNTIME}.json"

      - name: Upload individual result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.framework }}-${{ matrix.runtime }}
          path: results/
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e

          fuser -k "${PORT}/tcp" 2>/dev/null || true

          docker ps -aq \
            --filter "ancestor=$SPRING_NATIVE_IMAGE" |
            xargs -r docker rm -f

          docker image rm -f "$SPRING_NATIVE_IMAGE" 2>/dev/null || true

  # ===========================================================================
  # REPORT
  # ===========================================================================

  report:
    name: Generate benchmark report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: benchmark
    if: always()

    steps:
      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: downloaded
          merge-multiple: true

      - name: Generate combined report
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports

          jq -s \
            'sort_by(.framework, .runtime)' \
            downloaded/*.json \
            > reports/results.json

          cat > reports/results.md <<EOF
          # Web Framework Benchmark

          **Run:** ${GITHUB_RUN_NUMBER}

          **Commit:** \`${GITHUB_SHA}\`

          **Measurements per runtime:** ${RUNS}

          > All native artifact sizes represent native executable sizes.
          > Spring's native executable is extracted from its Buildpacks image
          > and run directly, without Docker startup overhead.

          > A failed or unavailable measurement is shown as **FAILED** and is
          > represented as \`null\` in the JSON results.

          ## Results

          | Framework | Runtime | Status | Build | Artifact | Startup median | Startup P95 | Memory median | HTTP avg | HTTP P95 |
          |---|---|---|---:|---:|---:|---:|---:|---:|---:|
          EOF

          jq -r '
            def measurement($value; $unit):
              if $value == null then
                "**FAILED**"
              else
                "\($value) \($unit)"
              end;

            .[] |
            "| \(.framework) | \(.runtime) | \(.status) | " +
            "\(measurement(.build_time_ms; "ms")) | " +
            "\(measurement(.artifact_size_mb; "MB")) | " +
            "\(measurement(.startup_median_ms; "ms")) | " +
            "\(measurement(.startup_p95_ms; "ms")) | " +
            "\(measurement(.memory_median_mb; "MB")) | " +
            "\(measurement(.http_average_ms; "ms")) | " +
            "\(measurement(.http_p95_ms; "ms")) |"
          ' reports/results.json >> reports/results.md

          cat reports/results.md

      - name: Add report to GitHub Summary
        shell: bash
        run: |
          set -euo pipefail
          cat reports/results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            reports/results.md
            reports/results.json
          retention-days: 90
          if-no-files-found: error
